    <!-- Dark Mode Script - Must run before page renders to prevent flash -->
    <script>
      (function() {
        // Helper function to determine theme based on time
        function getAutoTheme() {
          const hour = new Date().getHours();
          return (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }
        
        // Check if user has manually set theme
        const themeMode = localStorage.getItem('tvu-connect-theme-mode');
        let theme;
        
        if (themeMode === 'manual') {
          // User has manually chosen, use their preference
          theme = localStorage.getItem('tvu-connect-theme') || 'light';
        } else {
          // Auto mode: determine by time
          theme = getAutoTheme();
        }
        
        // CRITICAL: Ensure clean state before applying theme
        // Remove any existing dark class first to prevent conflicts
        document.documentElement.classList.remove('dark');
        
        // Apply theme immediately to prevent flash
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        
        // Debug log for mobile testing (remove in production)
        console.log('[Dark Mode Init]', {
          themeMode: themeMode,
          theme: theme,
          hour: new Date().getHours(),
          hasDarkClass: document.documentElement.classList.contains('dark')
        });
      })();
    </script>

  <body class="notranslate">
    <div id="root"></div>
    
    <!-- Google API Script - Load before app -->
    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Register optimized service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw-optimized.js')
            .then((registration) => {
              console.log('[SW] Registered successfully:', registration.scope);
              
              // Check for updates periodically
              setInterval(() => {
                registration.update();
              }, 60 * 60 * 1000); // Check every hour
              
              // Handle updates
              registration.addEventListener('updatefound', () => {
                const newWorker = registration.installing;
                newWorker.addEventListener('statechange', () => {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // New service worker available
                    console.log('[SW] New version available');
                    // Optionally show update notification to user
                  }
                });
              });
            })
            .catch((error) => {
              console.error('[SW] Registration failed:', error);
            });
        });
      }
    </script>
  </body>
