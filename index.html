<!doctype html>
<html lang="vi" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="google" content="notranslate" />
    <meta http-equiv="Content-Language" content="vi" />
    
    <!-- SEO & Social Media Meta Tags -->
    <title>TVU Connect - Kết nối sinh viên TVU</title>
    <meta name="description" content="Nền tảng kết nối sinh viên Đại học Trà Vinh - Tìm bạn học, bạn cùng sở thích và người yêu" />
    <meta name="author" content="TVU Connect" />
    <meta name="keywords" content="TVU, Đại học Trà Vinh, sinh viên, kết nối, bạn bè, học tập" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tvu-connect.vercel.app/" />
    <meta property="og:title" content="TVU Connect" />
    <meta property="og:description" content="Kết nối sinh viên Đại học Trà Vinh" />
    <meta property="og:site_name" content="TVU Connect" />
    <meta property="og:image" content="https://tvuconnect.vercel.app/icon-512.png" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#0b1027" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.json" />
    
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <style>html,body,#root{margin:0;min-height:100%;background:#050817}</style>
    
    <!-- Dark Mode Script - Must run before page renders to prevent flash -->
    <script>
      (function() {
        // Helper function to determine theme based on time
        function getAutoTheme() {
          const hour = new Date().getHours();
          return (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }
        
        // Check if user has manually set theme
        const themeMode = localStorage.getItem('tvu-connect-theme-mode');
        let theme;
        
        if (themeMode === 'manual') {
          // User has manually chosen, use their preference
          theme = localStorage.getItem('tvu-connect-theme') || 'light';
        } else {
          // Auto mode: determine by time
          theme = getAutoTheme();
        }
        
        // CRITICAL: Ensure clean state before applying theme
        // Remove any existing dark class first to prevent conflicts
        document.documentElement.classList.remove('dark');
        
        // Apply theme immediately to prevent flash
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
        
      })();
    </script>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    
    <script type="module" src="/src/main.tsx"></script>
    
  </body>
</html>
