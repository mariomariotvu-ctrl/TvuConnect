<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đếm Tài Liệu - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 800px;
      width: 100%;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
    }

    .subtitle {
      color: #666;
      text-align: center;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }

    .stat-number {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 15px;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }

    .button:active {
      transform: translateY(0);
    }

    .button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      text-align: center;
      color: #667eea;
      margin: 20px 0;
      font-weight: 600;
    }

    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      border-left: 4px solid #c33;
    }

    .success {
      background: #efe;
      color: #3c3;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
      border-left: 4px solid #3c3;
    }

    .documents-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 15px;
    }

    .document-item {
      padding: 12px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .document-item:last-child {
      border-bottom: none;
    }

    .document-title {
      font-weight: 600;
      color: #333;
      flex: 1;
    }

    .document-meta {
      font-size: 12px;
      color: #999;
      margin-left: 10px;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📚 Đếm Tài Liệu</h1>
    <p class="subtitle">Kiểm tra số lượng tài liệu trong Document Repository</p>

    <div class="stats-grid" id="statsGrid" style="display: none;">
      <div class="stat-card">
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">Tổng số tài liệu</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="majorCount">0</div>
        <div class="stat-label">Số ngành học</div>
      </div>
      <div class="stat-card">
        <div class="stat-number" id="subjectCount">0</div>
        <div class="stat-label">Số môn học</div>
      </div>
    </div>

    <button class="button" onclick="countDocuments()">
      🔍 Đếm Tài Liệu
    </button>

    <button class="button" onclick="showAllDocuments()" id="showAllBtn" style="display: none;">
      📋 Xem Danh Sách Tài Liệu
    </button>

    <div id="loading" style="display: none;">
      <div class="spinner"></div>
      <p class="loading">Đang tải dữ liệu...</p>
    </div>

    <div id="message"></div>

    <div id="documentsList" class="documents-list" style="display: none;"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDCyOb2zXPmxbLHWT0ax8phKe_SgRKNGvg",
      authDomain: "tvu-connect.firebaseapp.com",
      projectId: "tvu-connect",
      storageBucket: "tvu-connect.firebasestorage.app",
      messagingSenderId: "821921697126",
      appId: "1:821921697126:web:e2f7443c6e134e1c6c2f0e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let documentsData = [];

    window.countDocuments = async function() {
      const loading = document.getElementById('loading');
      const message = document.getElementById('message');
      const statsGrid = document.getElementById('statsGrid');
      const showAllBtn = document.getElementById('showAllBtn');

      loading.style.display = 'block';
      message.innerHTML = '';
      statsGrid.style.display = 'none';
      showAllBtn.style.display = 'none';

      try {
        const q = query(collection(db, 'documentLinks'), orderBy('createdAt', 'desc'));
        const querySnapshot = await getDocs(q);
        
        documentsData = [];
        const majors = new Set();
        const subjects = new Set();

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          documentsData.push({
            id: doc.id,
            ...data
          });
          
          if (data.major_id) {
            majors.add(data.major_id);
          }
          
          if (data.subject) {
            subjects.add(data.subject);
          }
        });

        const totalCount = documentsData.length;
        const majorCount = majors.size;
        const subjectCount = subjects.size;

        document.getElementById('totalCount').textContent = totalCount;
        document.getElementById('majorCount').textContent = majorCount;
        document.getElementById('subjectCount').textContent = subjectCount;

        statsGrid.style.display = 'grid';
        showAllBtn.style.display = 'block';

        message.innerHTML = `
          <div class="success">
            ✅ Đã tải thành công ${totalCount} tài liệu!<br>
            📊 Phân bố: ${majorCount} ngành học, ${subjectCount} môn học
          </div>
        `;

      } catch (error) {
        console.error('Error:', error);
        message.innerHTML = `
          <div class="error">
            ❌ Lỗi: ${error.message}
          </div>
        `;
      } finally {
        loading.style.display = 'none';
      }
    };

    window.showAllDocuments = function() {
      const documentsList = document.getElementById('documentsList');
      
      if (documentsList.style.display === 'none') {
        let html = '<h3 style="margin-bottom: 15px; color: #667eea;">📋 Danh Sách Tài Liệu</h3>';
        
        documentsData.forEach((doc, index) => {
          const createdAt = doc.createdAt ? new Date(doc.createdAt.seconds * 1000).toLocaleDateString('vi-VN') : 'N/A';
          html += `
            <div class="document-item">
              <div>
                <div class="document-title">${index + 1}. ${doc.title || 'Không có tiêu đề'}</div>
                <div class="document-meta">
                  ${doc.major_id || 'N/A'} ${doc.subject ? '• ' + doc.subject : ''}
                </div>
              </div>
              <div class="document-meta">${createdAt}</div>
            </div>
          `;
        });
        
        documentsList.innerHTML = html;
        documentsList.style.display = 'block';
        document.getElementById('showAllBtn').textContent = '🔼 Ẩn Danh Sách';
      } else {
        documentsList.style.display = 'none';
        document.getElementById('showAllBtn').textContent = '📋 Xem Danh Sách Tài Liệu';
      }
    };
  </script>
</body>
</html>
