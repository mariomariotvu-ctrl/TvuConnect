<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra Google API Key Restrictions</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
    }
    .info-box {
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .warning-box {
      background: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .error-box {
      background: #f8d7da;
      border-left: 4px solid #dc3545;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    .success-box {
      background: #d4edda;
      border-left: 4px solid #28a745;
      padding: 15px;
      margin: 20px 0;
      border-radius: 4px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
      transition: all 0.3s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .step {
      background: #f8f9fa;
      padding: 15px;
      margin: 15px 0;
      border-radius: 6px;
      border: 1px solid #dee2e6;
    }
    .step-title {
      font-weight: bold;
      color: #667eea;
      margin-bottom: 10px;
    }
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      color: #e83e8c;
    }
    pre {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 10px 0;
    }
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      margin-left: 10px;
    }
    .status-pending {
      background: #ffc107;
      color: #000;
    }
    .status-success {
      background: #28a745;
      color: white;
    }
    .status-error {
      background: #dc3545;
      color: white;
    }
    .checklist {
      list-style: none;
      padding: 0;
    }
    .checklist li {
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    .checklist li:before {
      content: "☐ ";
      color: #667eea;
      font-weight: bold;
      margin-right: 8px;
    }
    .checklist li.done:before {
      content: "✓ ";
      color: #28a745;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Kiểm tra Google API Key Restrictions</h1>
    <p class="subtitle">Tool này sẽ giúp bạn xác định chính xác vấn đề với Google Drive API</p>

    <div class="info-box">
      <strong>🎯 Mục đích:</strong><br>
      Kiểm tra xem API Key có bị restrictions chặn hay không, và hướng dẫn fix chi tiết.
    </div>

    <div class="step">
      <div class="step-title">📍 Thông tin hiện tại:</div>
      <div id="currentInfo">Đang tải...</div>
    </div>

    <button onclick="testApiKey()">🧪 Test API Key</button>
    <button onclick="testOAuthInit()">🔐 Test OAuth Init</button>
    <button onclick="showFixGuide()">📖 Xem hướng dẫn Fix</button>

    <div id="results"></div>
    <div id="fixGuide" style="display: none;"></div>
  </div>

  <script>
    // Config từ .env.local
    const API_KEY = 'AIzaSyCtnoYUJKlFKoRh_wvCbzbesEX_35qLmPM';
    const CLIENT_ID = '1009958335039-pbekot71qflkpk7tgg5jr2c59oat0oan.apps.googleusercontent.com';

    // Hiển thị thông tin hiện tại
    function displayCurrentInfo() {
      const origin = window.location.origin;
      const port = window.location.port;
      
      document.getElementById('currentInfo').innerHTML = `
        <strong>Origin:</strong> <code>${origin}</code><br>
        <strong>Port:</strong> <code>${port}</code><br>
        <strong>API Key:</strong> <code>${API_KEY.substring(0, 20)}...</code><br>
        <strong>Client ID:</strong> <code>${CLIENT_ID.substring(0, 30)}...</code>
      `;
    }

    // Test API Key
    async function testApiKey() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="info-box">⏳ Đang test API Key...</div>';

      try {
        // Test 1: Simple API call
        const response = await fetch(
          `https://www.googleapis.com/drive/v3/about?fields=user&key=${API_KEY}`
        );

        if (response.ok) {
          resultsDiv.innerHTML = `
            <div class="success-box">
              <strong>✅ API Key hoạt động tốt!</strong><br>
              Status: ${response.status}<br>
              Vấn đề KHÔNG phải ở API Key restrictions.
            </div>
          `;
        } else {
          const error = await response.json();
          resultsDiv.innerHTML = `
            <div class="error-box">
              <strong>❌ API Key bị lỗi!</strong><br>
              Status: ${response.status}<br>
              Error: <code>${error.error?.message || 'Unknown'}</code><br><br>
              <strong>🔧 Nguyên nhân có thể:</strong><br>
              1. API Key bị restrictions chặn origin này<br>
              2. Google Drive API chưa được enable<br>
              3. API Key không hợp lệ
            </div>
          `;
        }
      } catch (error) {
        resultsDiv.innerHTML = `
          <div class="error-box">
            <strong>❌ Lỗi kết nối!</strong><br>
            ${error.message}
          </div>
        `;
      }
    }

    // Test OAuth Init
    async function testOAuthInit() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="info-box">⏳ Đang test OAuth initialization...</div>';

      // Load gapi
      const script = document.createElement('script');
      script.src = 'https://apis.google.com/js/api.js';
      
      script.onload = () => {
        gapi.load('client:auth2', async () => {
          try {
            console.log('🔧 Init config:', {
              apiKey: API_KEY.substring(0, 20) + '...',
              clientId: CLIENT_ID.substring(0, 30) + '...',
              origin: window.location.origin,
            });

            await gapi.client.init({
              apiKey: API_KEY,
              clientId: CLIENT_ID,
              discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
              scope: 'https://www.googleapis.com/auth/drive.file',
            });

            resultsDiv.innerHTML = `
              <div class="success-box">
                <strong>✅ OAuth init thành công!</strong><br>
                Google Drive API đã sẵn sàng.<br><br>
                <strong>Kết luận:</strong> Vấn đề đã được fix! Bạn có thể upload file ngay bây giờ.
              </div>
            `;
          } catch (error) {
            console.error('❌ Init error:', error);
            
            let diagnosis = '';
            let solution = '';

            if (error.details?.includes('origin_mismatch') || error.details?.includes('redirect_uri_mismatch')) {
              diagnosis = 'Origin không khớp với config trong Google Console';
              solution = `
                <strong>🔧 Giải pháp:</strong><br>
                1. Vào: <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Console Credentials</a><br>
                2. Click vào OAuth Client ID<br>
                3. Thêm <code>${window.location.origin}</code> vào:<br>
                   - Authorized JavaScript origins<br>
                   - Authorized redirect URIs<br>
                4. Click SAVE<br>
                5. Đợi 2-3 phút để Google cập nhật<br>
                6. Clear cache và test lại
              `;
            } else if (error.details?.includes('API key')) {
              diagnosis = 'API Key bị restrictions';
              solution = `
                <strong>🔧 Giải pháp:</strong><br>
                1. Vào: <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Console Credentials</a><br>
                2. Click vào API Key (KHÔNG phải OAuth Client ID)<br>
                3. Tại "Application restrictions":<br>
                   - Chọn "HTTP referrers (web sites)"<br>
                   - Thêm: <code>${window.location.origin}/*</code><br>
                4. Tại "API restrictions":<br>
                   - Chọn "Restrict key"<br>
                   - Enable "Google Drive API"<br>
                5. Click SAVE<br>
                6. Đợi 2-3 phút và test lại
              `;
            } else {
              diagnosis = 'Lỗi không xác định';
              solution = 'Xem console log để biết thêm chi tiết';
            }

            resultsDiv.innerHTML = `
              <div class="error-box">
                <strong>❌ OAuth init thất bại!</strong><br><br>
                <strong>Chẩn đoán:</strong> ${diagnosis}<br><br>
                ${solution}<br><br>
                <strong>Chi tiết lỗi:</strong><br>
                <pre>${JSON.stringify(error, null, 2)}</pre>
              </div>
            `;
          }
        });
      };

      script.onerror = () => {
        resultsDiv.innerHTML = `
          <div class="error-box">
            <strong>❌ Không thể tải Google API script!</strong><br>
            Kiểm tra kết nối internet.
          </div>
        `;
      };

      document.body.appendChild(script);
    }

    // Show fix guide
    function showFixGuide() {
      const guideDiv = document.getElementById('fixGuide');
      guideDiv.style.display = 'block';
      guideDiv.innerHTML = `
        <div class="warning-box">
          <h2>📖 Hướng dẫn Fix chi tiết</h2>
          
          <h3>🎯 Bước 1: Fix API Key Restrictions</h3>
          <ol>
            <li>Vào: <a href="https://console.cloud.google.com/apis/credentials" target="_blank">https://console.cloud.google.com/apis/credentials</a></li>
            <li>Tìm và click vào <strong>API Key</strong> (KHÔNG phải OAuth Client ID)</li>
            <li>Tại mục <strong>"Application restrictions"</strong>:
              <ul>
                <li>Chọn: <code>HTTP referrers (web sites)</code></li>
                <li>Click <strong>"+ ADD AN ITEM"</strong></li>
                <li>Thêm: <code>http://localhost:5173/*</code></li>
                <li>Thêm: <code>http://localhost:3000/*</code></li>
                <li>Thêm: <code>https://tvu-connect.vercel.app/*</code></li>
              </ul>
            </li>
            <li>Tại mục <strong>"API restrictions"</strong>:
              <ul>
                <li>Chọn: <code>Restrict key</code></li>
                <li>Tìm và enable: <code>Google Drive API</code></li>
              </ul>
            </li>
            <li>Click <strong>SAVE</strong></li>
          </ol>

          <h3>🎯 Bước 2: Fix OAuth Client ID</h3>
          <ol>
            <li>Vẫn ở trang Credentials</li>
            <li>Tìm và click vào <strong>OAuth 2.0 Client ID</strong></li>
            <li>Tại mục <strong>"Authorized JavaScript origins"</strong>:
              <ul>
                <li>Click <strong>"+ ADD URI"</strong></li>
                <li>Thêm: <code>http://localhost:5173</code></li>
                <li>Thêm: <code>http://localhost:3000</code></li>
                <li>Thêm: <code>https://tvu-connect.vercel.app</code></li>
              </ul>
            </li>
            <li>Tại mục <strong>"Authorized redirect URIs"</strong>:
              <ul>
                <li>Click <strong>"+ ADD URI"</strong></li>
                <li>Thêm: <code>http://localhost:5173</code></li>
                <li>Thêm: <code>http://localhost:3000</code></li>
                <li>Thêm: <code>https://tvu-connect.vercel.app</code></li>
              </ul>
            </li>
            <li>Click <strong>SAVE</strong></li>
          </ol>

          <h3>🎯 Bước 3: Đợi và Test</h3>
          <ul class="checklist">
            <li>Đợi 2-3 phút để Google cập nhật config</li>
            <li>Restart dev server: <code>npm run dev</code></li>
            <li>Clear browser cache (F12 → Right-click Refresh → Empty Cache and Hard Reload)</li>
            <li>Quay lại trang này và click "Test OAuth Init"</li>
            <li>Nếu thành công, test upload file trong app</li>
          </ul>

          <h3>⚠️ Lưu ý quan trọng</h3>
          <ul>
            <li><strong>API Key</strong> và <strong>OAuth Client ID</strong> là 2 thứ KHÁC NHAU</li>
            <li>Phải config CẢ HAI</li>
            <li>Phải thêm cả 3 origins: localhost:5173, localhost:3000, và vercel.app</li>
            <li>Phải click SAVE sau mỗi thay đổi</li>
            <li>Google cache mất 2-3 phút để cập nhật</li>
          </ul>
        </div>
      `;
      
      // Scroll to guide
      guideDiv.scrollIntoView({ behavior: 'smooth' });
    }

    // Initialize
    displayCurrentInfo();
  </script>
</body>
</html>
