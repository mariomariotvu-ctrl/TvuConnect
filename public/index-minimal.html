<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVU Connect - Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .status {
            background: rgba(255,255,255,0.2);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px;
        }
        .success { color: #10b981; }
        .error { color: #ef4444; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 TVU Connect Debug</h1>
        
        <div class="status">
            <h2>Status: <span id="status">Testing...</span></h2>
            <p id="message">Đang kiểm tra...</p>
        </div>
        
        <div id="tests"></div>
        
        <button onclick="testFirebase()">Test Firebase</button>
        <button onclick="testLocalStorage()">Test Storage</button>
        <button onclick="clearAll()">Clear All</button>
        <button onclick="goToApp()">Go to App</button>
    </div>
    
    <script type="module">
        // Test 1: Basic JavaScript
        console.log('✅ JavaScript works');
        document.getElementById('status').textContent = 'JavaScript OK';
        document.getElementById('status').className = 'success';
        
        // Test 2: LocalStorage
        window.testLocalStorage = function() {
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                alert('✅ LocalStorage works');
            } catch (e) {
                alert('❌ LocalStorage error: ' + e.message);
            }
        };
        
        // Test 3: Firebase
        window.testFirebase = async function() {
            try {
                const response = await fetch('https://firestore.googleapis.com/v1/projects/gen-lang-client-0050597412/databases/(default)/documents/profiles?pageSize=1');
                if (response.ok) {
                    alert('✅ Firebase connection OK');
                } else {
                    alert('⚠️ Firebase response: ' + response.status);
                }
            } catch (e) {
                alert('❌ Firebase error: ' + e.message);
            }
        };
        
        // Test 4: Clear all
        window.clearAll = function() {
            try {
                localStorage.clear();
                sessionStorage.clear();
                
                // Unregister service workers
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.getRegistrations().then(regs => {
                        regs.forEach(reg => reg.unregister());
                    });
                }
                
                // Clear caches
                if ('caches' in window) {
                    caches.keys().then(keys => {
                        keys.forEach(key => caches.delete(key));
                    });
                }
                
                alert('✅ Cleared all data. Reloading...');
                setTimeout(() => location.reload(), 1000);
            } catch (e) {
                alert('❌ Clear error: ' + e.message);
            }
        };
        
        // Go to app
        window.goToApp = function() {
            window.location.href = '/';
        };
        
        // Show device info
        const testsDiv = document.getElementById('tests');
        testsDiv.innerHTML = `
            <div class="status">
                <h3>Device Info</h3>
                <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                <p><strong>Screen:</strong> ${window.screen.width}x${window.screen.height}</p>
                <p><strong>Online:</strong> ${navigator.onLine ? 'Yes' : 'No'}</p>
                <p><strong>Service Worker:</strong> ${'serviceWorker' in navigator ? 'Supported' : 'Not supported'}</p>
                <p><strong>IndexedDB:</strong> ${'indexedDB' in window ? 'Supported' : 'Not supported'}</p>
            </div>
        `;
        
        document.getElementById('message').textContent = 'All basic tests passed!';
    </script>
</body>
</html>
