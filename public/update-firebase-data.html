<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật dữ liệu Firebase - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    select, input, button {
      padding: 10px 15px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.3s;
    }

    select, input {
      flex: 1;
      min-width: 200px;
    }

    select:focus, input:focus {
      border-color: #667eea;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
      min-width: 120px;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .btn-success {
      background: #28a745;
    }

    .btn-success:hover {
      background: #218838;
    }

    .btn-danger {
      background: #dc3545;
    }

    .btn-danger:hover {
      background: #c82333;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    .data-table th {
      background: #667eea;
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
    }

    .data-table td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .data-table tr:hover {
      background: #f8f9fa;
    }

    .data-table tr:last-child td {
      border-bottom: none;
    }

    .edit-form {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: white;
      border-radius: 10px;
      border: 2px solid #667eea;
    }

    .edit-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      color: #333;
      font-weight: 600;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-group textarea {
      min-height: 100px;
      resize: vertical;
    }

    .status {
      padding: 10px 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 600;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-primary {
      background: #667eea;
      color: white;
    }

    .badge-success {
      background: #28a745;
      color: white;
    }

    .badge-warning {
      background: #ffc107;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Cập nhật dữ liệu Firebase</h1>
    <p class="subtitle">Tool quản lý và cập nhật dữ liệu cho TVU Connect</p>

    <!-- Section 1: Chọn Collection -->
    <div class="section">
      <h2>1️⃣ Chọn Collection</h2>
      <div class="controls">
        <select id="collectionSelect">
          <option value="">-- Chọn collection --</option>
          <option value="users">👤 Users (Người dùng)</option>
          <option value="places">📍 Places (Địa điểm)</option>
          <option value="posts">📝 Posts (Bài viết)</option>
          <option value="checkIns">✅ Check-ins</option>
          <option value="events">🎉 Events (Sự kiện)</option>
          <option value="messages">💬 Messages (Tin nhắn)</option>
          <option value="matches">💑 Matches (Ghép đôi)</option>
        </select>
        <button id="loadDataBtn" onclick="loadCollectionData()">📥 Tải dữ liệu</button>
      </div>
      <div id="collectionStatus"></div>
    </div>

    <!-- Section 2: Hiển thị dữ liệu -->
    <div class="section">
      <h2>2️⃣ Dữ liệu hiện có</h2>
      <div id="dataCount" class="status info" style="display: none;">
        Tổng số: <strong>0</strong> documents
      </div>
      <div id="dataContainer"></div>
    </div>

    <!-- Section 3: Form chỉnh sửa -->
    <div class="section">
      <h2>3️⃣ Chỉnh sửa dữ liệu</h2>
      <div id="editFormContainer"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc, 
      updateDoc,
      deleteDoc,
      query,
      limit,
      orderBy
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBB1ulUF5F7iScd1vm4xOfQamFlT5pbP9M",
      authDomain: "gen-lang-client-0050597412.firebaseapp.com",
      projectId: "gen-lang-client-0050597412",
      storageBucket: "gen-lang-client-0050597412.firebasestorage.app",
      messagingSenderId: "488839097354",
      appId: "1:488839097354:web:4a8bb2c137ec7b2c3c5b9c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentData = [];
    let currentCollection = '';

    // Load collection data
    window.loadCollectionData = async function() {
      const collectionName = document.getElementById('collectionSelect').value;
      if (!collectionName) {
        showStatus('collectionStatus', 'Vui lòng chọn collection!', 'error');
        return;
      }

      currentCollection = collectionName;
      const loadBtn = document.getElementById('loadDataBtn');
      loadBtn.disabled = true;
      loadBtn.innerHTML = '⏳ Đang tải...';

      try {
        const collectionRef = collection(db, collectionName);
        const q = query(collectionRef, limit(50)); // Limit 50 documents
        const snapshot = await getDocs(q);

        currentData = [];
        snapshot.forEach((doc) => {
          currentData.push({
            id: doc.id,
            ...doc.data()
          });
        });

        displayData(currentData, collectionName);
        showStatus('collectionStatus', `✅ Đã tải ${currentData.length} documents từ collection "${collectionName}"`, 'success');
        
        document.getElementById('dataCount').style.display = 'block';
        document.getElementById('dataCount').innerHTML = `Tổng số: <strong>${currentData.length}</strong> documents`;

      } catch (error) {
        console.error('Error loading data:', error);
        showStatus('collectionStatus', `❌ Lỗi: ${error.message}`, 'error');
      } finally {
        loadBtn.disabled = false;
        loadBtn.innerHTML = '📥 Tải dữ liệu';
      }
    };

    // Display data in table
    function displayData(data, collectionName) {
      const container = document.getElementById('dataContainer');
      
      if (data.length === 0) {
        container.innerHTML = '<p class="status info">Không có dữ liệu trong collection này.</p>';
        return;
      }

      // Get all unique keys
      const allKeys = new Set();
      data.forEach(item => {
        Object.keys(item).forEach(key => allKeys.add(key));
      });

      // Create table
      let html = '<table class="data-table"><thead><tr>';
      html += '<th>Actions</th>';
      
      // Add headers (limit to important fields)
      const importantFields = ['id', 'name', 'displayName', 'email', 'category', 'content', 'createdAt'];
      const displayKeys = Array.from(allKeys).filter(key => 
        importantFields.includes(key) || allKeys.size <= 8
      ).slice(0, 8);

      displayKeys.forEach(key => {
        html += `<th>${key}</th>`;
      });
      html += '</tr></thead><tbody>';

      // Add rows
      data.forEach((item, index) => {
        html += '<tr>';
        html += `<td>
          <button onclick="editDocument('${item.id}')" style="padding: 5px 10px; margin-right: 5px;">✏️ Sửa</button>
          <button onclick="deleteDocument('${item.id}')" class="btn-danger" style="padding: 5px 10px;">🗑️ Xóa</button>
        </td>`;
        
        displayKeys.forEach(key => {
          let value = item[key];
          
          // Format value
          if (value === undefined || value === null) {
            value = '-';
          } else if (typeof value === 'object') {
            if (value.toDate && typeof value.toDate === 'function') {
              // Firestore Timestamp
              value = value.toDate().toLocaleString('vi-VN');
            } else {
              value = JSON.stringify(value).substring(0, 50) + '...';
            }
          } else if (typeof value === 'string' && value.length > 50) {
            value = value.substring(0, 50) + '...';
          }
          
          html += `<td>${value}</td>`;
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    // Edit document
    window.editDocument = function(docId) {
      const item = currentData.find(d => d.id === docId);
      if (!item) return;

      const formContainer = document.getElementById('editFormContainer');
      
      let html = `<div class="edit-form active">
        <h3>Chỉnh sửa Document: ${docId}</h3>
        <form id="editForm" onsubmit="saveDocument(event, '${docId}')">`;

      // Create form fields for each property
      Object.keys(item).forEach(key => {
        if (key === 'id') return; // Skip ID

        let value = item[key];
        let inputType = 'text';
        let inputHtml = '';

        // Determine input type
        if (typeof value === 'boolean') {
          inputHtml = `
            <select name="${key}" class="form-control">
              <option value="true" ${value === true ? 'selected' : ''}>True</option>
              <option value="false" ${value === false ? 'selected' : ''}>False</option>
            </select>`;
        } else if (typeof value === 'number') {
          inputHtml = `<input type="number" name="${key}" value="${value}" class="form-control">`;
        } else if (typeof value === 'object') {
          if (value && value.toDate && typeof value.toDate === 'function') {
            // Firestore Timestamp
            const dateStr = value.toDate().toISOString().slice(0, 16);
            inputHtml = `<input type="datetime-local" name="${key}" value="${dateStr}" class="form-control">`;
          } else {
            inputHtml = `<textarea name="${key}" class="form-control">${JSON.stringify(value, null, 2)}</textarea>`;
          }
        } else {
          const strValue = String(value || '');
          if (strValue.length > 100) {
            inputHtml = `<textarea name="${key}" class="form-control">${strValue}</textarea>`;
          } else {
            inputHtml = `<input type="text" name="${key}" value="${strValue}" class="form-control">`;
          }
        }

        html += `
          <div class="form-group">
            <label>${key}</label>
            ${inputHtml}
          </div>`;
      });

      html += `
          <div style="display: flex; gap: 10px; margin-top: 20px;">
            <button type="submit" class="btn-success">💾 Lưu thay đổi</button>
            <button type="button" onclick="cancelEdit()" class="btn-danger">❌ Hủy</button>
          </div>
        </form>
        <div id="editStatus"></div>
      </div>`;

      formContainer.innerHTML = html;
      formContainer.scrollIntoView({ behavior: 'smooth' });
    };

    // Save document
    window.saveDocument = async function(event, docId) {
      event.preventDefault();
      
      const form = event.target;
      const formData = new FormData(form);
      const updates = {};

      // Build update object
      for (let [key, value] of formData.entries()) {
        // Try to parse as JSON for objects
        if (value.startsWith('{') || value.startsWith('[')) {
          try {
            updates[key] = JSON.parse(value);
          } catch {
            updates[key] = value;
          }
        } else if (value === 'true') {
          updates[key] = true;
        } else if (value === 'false') {
          updates[key] = false;
        } else if (!isNaN(value) && value !== '') {
          updates[key] = Number(value);
        } else {
          updates[key] = value;
        }
      }

      try {
        const docRef = doc(db, currentCollection, docId);
        await updateDoc(docRef, updates);
        
        showStatus('editStatus', '✅ Cập nhật thành công!', 'success');
        
        // Reload data
        setTimeout(() => {
          loadCollectionData();
          cancelEdit();
        }, 1500);

      } catch (error) {
        console.error('Error updating document:', error);
        showStatus('editStatus', `❌ Lỗi: ${error.message}`, 'error');
      }
    };

    // Delete document
    window.deleteDocument = async function(docId) {
      if (!confirm(`Bạn có chắc muốn xóa document "${docId}"?`)) {
        return;
      }

      try {
        const docRef = doc(db, currentCollection, docId);
        await deleteDoc(docRef);
        
        showStatus('collectionStatus', '✅ Đã xóa document!', 'success');
        
        // Reload data
        setTimeout(() => {
          loadCollectionData();
        }, 1000);

      } catch (error) {
        console.error('Error deleting document:', error);
        showStatus('collectionStatus', `❌ Lỗi: ${error.message}`, 'error');
      }
    };

    // Cancel edit
    window.cancelEdit = function() {
      document.getElementById('editFormContainer').innerHTML = '<p class="status info">Chọn một document để chỉnh sửa</p>';
    };

    // Show status message
    function showStatus(elementId, message, type) {
      const element = document.getElementById(elementId);
      element.className = `status ${type}`;
      element.innerHTML = message;
      element.style.display = 'block';
    }

    // Initialize
    document.getElementById('editFormContainer').innerHTML = '<p class="status info">Chọn một document để chỉnh sửa</p>';
  </script>
</body>
</html>
