<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống Kê Địa Điểm - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
      text-align: center;
    }

    h1 {
      color: #667eea;
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #666;
      font-size: 1.1rem;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
    }

    .stat-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .stat-number {
      font-size: 2.5rem;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .stat-label {
      color: #666;
      font-size: 1rem;
    }

    .categories-section {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    .section-title {
      font-size: 1.8rem;
      color: #333;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 3px solid #667eea;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }

    .category-item {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform 0.2s;
    }

    .category-item:hover {
      transform: scale(1.05);
    }

    .category-name {
      font-weight: 600;
    }

    .category-count {
      background: rgba(255,255,255,0.3);
      padding: 5px 12px;
      border-radius: 20px;
      font-weight: bold;
    }

    .places-list {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .place-item {
      padding: 15px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .place-item:last-child {
      border-bottom: none;
    }

    .place-info {
      flex: 1;
    }

    .place-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .place-address {
      color: #666;
      font-size: 0.9rem;
    }

    .place-category {
      background: #667eea;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: white;
      font-size: 1.5rem;
    }

    .error {
      background: #ff4444;
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      margin: 20px 0;
    }

    .refresh-btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 20px;
    }

    .refresh-btn:hover {
      background: #764ba2;
    }

    .empty-state {
      text-align: center;
      padding: 50px;
      color: #666;
    }

    .empty-icon {
      font-size: 5rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📍 Thống Kê Địa Điểm</h1>
      <p class="subtitle">TVU Connect - Hệ thống quản lý địa điểm</p>
      <button class="refresh-btn" onclick="loadPlaces()">🔄 Làm mới</button>
    </div>

    <div id="loading" class="loading">
      <div>⏳ Đang tải dữ liệu...</div>
    </div>

    <div id="error" style="display: none;"></div>

    <div id="stats" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon">📍</div>
          <div class="stat-number" id="totalPlaces">0</div>
          <div class="stat-label">Tổng địa điểm</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">📂</div>
          <div class="stat-number" id="totalCategories">0</div>
          <div class="stat-label">Danh mục</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">✅</div>
          <div class="stat-number" id="verifiedPlaces">0</div>
          <div class="stat-label">Đã xác minh</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon">⭐</div>
          <div class="stat-number" id="avgRating">0</div>
          <div class="stat-label">Đánh giá TB</div>
        </div>
      </div>

      <div class="categories-section">
        <h2 class="section-title">📊 Thống kê theo danh mục</h2>
        <div id="categoryList" class="category-list"></div>
      </div>

      <div class="places-list">
        <h2 class="section-title">📋 Danh sách địa điểm</h2>
        <div id="placesList"></div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyDmXOcHLpVM9kHPvLMKdGNu_TX_rKcKaJo",
      authDomain: "gen-lang-client-0050597412.firebaseapp.com",
      projectId: "gen-lang-client-0050597412",
      storageBucket: "gen-lang-client-0050597412.firebasestorage.app",
      messagingSenderId: "906938746396",
      appId: "1:906938746396:web:e3f6c1e0d8e0c8e0c8e0c8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const CATEGORY_LABELS = {
      cafe: '☕ Quán nước',
      restaurant: '🍜 Quán ăn',
      vegetarian: '🥗 Quán chay',
      pharmacy: '💊 Nhà thuốc',
      flower: '💐 Tiệm hoa',
      printing: '🖨️ In ấn',
      clothing: '👔 Quần áo',
      shop: '🛒 Cửa hàng',
      bookstore: '📚 Nhà sách',
      study: '✏️ Chỗ học',
      sport: '⚽ Thể thao',
      entertainment: '🎮 Vui chơi',
      library: '📖 Thư viện',
      park: '🌳 Công viên',
      other: '📍 Khác'
    };

    async function loadPlaces() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const stats = document.getElementById('stats');

      loading.style.display = 'block';
      error.style.display = 'none';
      stats.style.display = 'none';

      try {
        const querySnapshot = await getDocs(collection(db, 'places'));
        const places = [];
        
        querySnapshot.forEach((doc) => {
          places.push({ id: doc.id, ...doc.data() });
        });

        if (places.length === 0) {
          showEmptyState();
          return;
        }

        displayStats(places);
        loading.style.display = 'none';
        stats.style.display = 'block';

      } catch (err) {
        console.error('Error loading places:', err);
        error.textContent = `❌ Lỗi: ${err.message}`;
        error.style.display = 'block';
        loading.style.display = 'none';
      }
    }

    function showEmptyState() {
      const loading = document.getElementById('loading');
      const stats = document.getElementById('stats');
      
      loading.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📭</div>
          <h2>Chưa có địa điểm nào</h2>
          <p>Hãy thêm địa điểm đầu tiên của bạn!</p>
        </div>
      `;
    }

    function displayStats(places) {
      // Total places
      document.getElementById('totalPlaces').textContent = places.length;

      // Categories count
      const categories = new Set(places.map(p => p.category || 'other'));
      document.getElementById('totalCategories').textContent = categories.size;

      // Verified places
      const verified = places.filter(p => p.isVerified).length;
      document.getElementById('verifiedPlaces').textContent = verified;

      // Average rating
      const ratings = places.map(p => {
        const rating = p.rating;
        if (typeof rating === 'number') return rating;
        if (typeof rating === 'string') return parseFloat(rating) || 0;
        return 0;
      });
      const avgRating = ratings.length > 0 
        ? (ratings.reduce((a, b) => a + b, 0) / ratings.length).toFixed(1)
        : '0.0';
      document.getElementById('avgRating').textContent = avgRating;

      // Category breakdown
      const categoryCount = {};
      places.forEach(place => {
        const cat = place.category || 'other';
        categoryCount[cat] = (categoryCount[cat] || 0) + 1;
      });

      const categoryList = document.getElementById('categoryList');
      categoryList.innerHTML = Object.entries(categoryCount)
        .sort((a, b) => b[1] - a[1])
        .map(([cat, count]) => `
          <div class="category-item">
            <span class="category-name">${CATEGORY_LABELS[cat] || cat}</span>
            <span class="category-count">${count}</span>
          </div>
        `).join('');

      // Places list
      const placesList = document.getElementById('placesList');
      placesList.innerHTML = places
        .sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0))
        .map(place => `
          <div class="place-item">
            <div class="place-info">
              <div class="place-name">${place.name || 'Chưa có tên'}</div>
              <div class="place-address">📍 ${place.location?.address || 'Chưa có địa chỉ'}</div>
            </div>
            <div class="place-category">${CATEGORY_LABELS[place.category] || place.category || 'Khác'}</div>
          </div>
        `).join('');
    }

    // Load on page load
    window.loadPlaces = loadPlaces;
    loadPlaces();
  </script>
</body>
</html>
