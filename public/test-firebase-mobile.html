<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Firebase Mobile - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 24px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .status {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.6;
    }
    .status.loading {
      background: #fff3cd;
      border: 2px solid #ffc107;
      color: #856404;
    }
    .status.success {
      background: #d4edda;
      border: 2px solid #28a745;
      color: #155724;
    }
    .status.error {
      background: #f8d7da;
      border: 2px solid #dc3545;
      color: #721c24;
    }
    .status.info {
      background: #d1ecf1;
      border: 2px solid #17a2b8;
      color: #0c5460;
    }
    .config-item {
      background: #f8f9fa;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      word-break: break-all;
    }
    .config-label {
      font-weight: bold;
      color: #495057;
      margin-bottom: 5px;
    }
    .config-value {
      color: #6c757d;
      font-family: 'Courier New', monospace;
    }
    button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 20px;
    }
    button:active {
      transform: scale(0.98);
    }
    .emoji {
      font-size: 24px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔥 Test Firebase Mobile</h1>
    <p class="subtitle">Kiểm tra kết nối Firebase trên thiết bị di động</p>
    
    <div id="results"></div>
    
    <button onclick="runTest()">🚀 Chạy Test Lại</button>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

    const resultsDiv = document.getElementById('results');

    function addStatus(message, type = 'info') {
      const div = document.createElement('div');
      div.className = `status ${type}`;
      div.innerHTML = message;
      resultsDiv.appendChild(div);
    }

    function addConfig(label, value) {
      const div = document.createElement('div');
      div.className = 'config-item';
      div.innerHTML = `
        <div class="config-label">${label}</div>
        <div class="config-value">${value || '❌ MISSING'}</div>
      `;
      resultsDiv.appendChild(div);
    }

    async function runTest() {
      resultsDiv.innerHTML = '';
      
      addStatus('<span class="emoji">🔍</span> Đang kiểm tra Firebase config...', 'loading');

      // Hardcoded config for testing
      const firebaseConfig = {
        apiKey: "AIzaSyByuf-sL2MfEE2zE4reYHxqAGlDg5CcJ9w",
        authDomain: "gen-lang-client-0050597412.firebaseapp.com",
        projectId: "gen-lang-client-0050597412",
        storageBucket: "gen-lang-client-0050597412.firebasestorage.app",
        messagingSenderId: "43871673395",
        appId: "1:43871673395:web:00e950c3694f2a49291746"
      };

      // Display config
      addConfig('API Key', firebaseConfig.apiKey ? firebaseConfig.apiKey.substring(0, 20) + '...' : 'MISSING');
      addConfig('Auth Domain', firebaseConfig.authDomain);
      addConfig('Project ID', firebaseConfig.projectId);
      addConfig('Storage Bucket', firebaseConfig.storageBucket);
      addConfig('Messaging Sender ID', firebaseConfig.messagingSenderId);
      addConfig('App ID', firebaseConfig.appId ? firebaseConfig.appId.substring(0, 30) + '...' : 'MISSING');

      // Check if all required fields exist
      const requiredFields = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
      const missingFields = requiredFields.filter(field => !firebaseConfig[field]);

      if (missingFields.length > 0) {
        addStatus(`<span class="emoji">❌</span> Thiếu các trường: ${missingFields.join(', ')}`, 'error');
        return;
      }

      addStatus('<span class="emoji">✅</span> Tất cả config fields đều có!', 'success');

      try {
        addStatus('<span class="emoji">🔄</span> Đang khởi tạo Firebase...', 'loading');
        const app = initializeApp(firebaseConfig);
        addStatus('<span class="emoji">✅</span> Firebase app khởi tạo thành công!', 'success');

        addStatus('<span class="emoji">🔄</span> Đang test Firebase Auth...', 'loading');
        const auth = getAuth(app);
        await signInAnonymously(auth);
        addStatus('<span class="emoji">✅</span> Firebase Auth hoạt động!', 'success');

        addStatus('<span class="emoji">🔄</span> Đang test Firestore...', 'loading');
        const db = getFirestore(app);
        const testQuery = await getDocs(collection(db, 'profiles'));
        addStatus(`<span class="emoji">✅</span> Firestore hoạt động! Tìm thấy ${testQuery.size} profiles`, 'success');

        addStatus('<span class="emoji">🎉</span> <strong>TẤT CẢ TEST ĐỀU PASS!</strong><br>Firebase hoạt động hoàn hảo trên thiết bị này.', 'success');

      } catch (error) {
        addStatus(`<span class="emoji">❌</span> <strong>LỖI:</strong><br>${error.code}<br>${error.message}`, 'error');
        
        if (error.code === 'auth/api-key-not-valid') {
          addStatus('<span class="emoji">💡</span> <strong>Giải pháp:</strong><br>API key không hợp lệ. Kiểm tra Firebase Console → Project Settings → General → Web API Key', 'info');
        } else if (error.code === 'auth/unauthorized-domain') {
          addStatus('<span class="emoji">💡</span> <strong>Giải pháp:</strong><br>Domain chưa được authorize. Vào Firebase Console → Authentication → Settings → Authorized domains và thêm domain này.', 'info');
        }
      }
    }

    // Auto run on load
    window.runTest = runTest;
    runTest();
  </script>
</body>
</html>
