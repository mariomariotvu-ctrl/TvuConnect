<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Places Categories - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-value {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }

    .category-section {
      margin-bottom: 30px;
    }

    .category-header {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .category-name {
      font-weight: bold;
      font-size: 18px;
      color: #333;
    }

    .category-count {
      background: #667eea;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: bold;
    }

    .places-list {
      display: grid;
      gap: 10px;
    }

    .place-item {
      background: #f8f9fa;
      padding: 12px 15px;
      border-radius: 8px;
      border-left: 4px solid #667eea;
    }

    .place-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .place-category {
      font-size: 12px;
      color: #666;
      font-family: monospace;
    }

    .unmapped {
      border-left-color: #dc3545;
    }

    .unmapped .place-category {
      color: #dc3545;
      font-weight: bold;
    }

    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 20px;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
    }

    .error {
      background: #dc3545;
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Debug Places Categories</h1>
    <p class="subtitle">Kiểm tra category mapping của tất cả địa điểm</p>

    <button onclick="loadPlaces()">🔄 Tải lại dữ liệu</button>

    <div id="loading" class="loading">Đang tải dữ liệu...</div>
    <div id="error" style="display: none;"></div>
    <div id="stats" style="display: none;"></div>
    <div id="results" style="display: none;"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDXSbxT_7s3pqbJI-SgjhhoHzoUPRlEMhE",
      authDomain: "tvu-connect.firebaseapp.com",
      projectId: "tvu-connect",
      storageBucket: "tvu-connect.firebasestorage.app",
      messagingSenderId: "185135176765",
      appId: "1:185135176765:web:e2c5e8f3f3f3f3f3f3f3f3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Category mapping từ PlaceList.tsx
    const categoryMap = {
      'Quán cà phê': 'cafe',
      'Quán ăn': 'restaurant',
      'Quán chay': 'vegetarian',
      'Nhà thuốc': 'pharmacy',
      'Tiệm hoa': 'flower',
      'In ấn': 'printing',
      'Photocopy': 'printing',
      'Quần áo': 'clothing',
      'Tiệm quần áo': 'clothing',
      'May thuê': 'clothing',
      'May đo': 'clothing',
      'Cửa hàng': 'shop',
      'Quán mỳ cay': 'restaurant',
      'Quán mì cay': 'restaurant',
      'Thư viện': 'library',
      'Công viên': 'park',
      'Chỗ học': 'study',
      'Thể thao': 'sport',
      'Nhà sách': 'bookstore',
      'Tiệm sách': 'bookstore',
      'Cửa hàng văn phòng phẩm': 'bookstore',
      'Khu vui chơi': 'entertainment',
      'Vui chơi': 'entertainment',
      'Game': 'entertainment',
      'Karaoke': 'entertainment',
      'Billiards': 'entertainment',
      'Bi-a': 'entertainment',
      'restaurant': 'restaurant',
      'cafe': 'cafe',
      'vegetarian': 'vegetarian',
      'pharmacy': 'pharmacy',
      'flower': 'flower',
      'printing': 'printing',
      'clothing': 'clothing',
      'shop': 'shop',
      'library': 'library',
      'park': 'park',
      'study': 'study',
      'sport': 'sport',
      'bookstore': 'bookstore',
      'entertainment': 'entertainment',
      'other': 'other'
    };

    function normalizeCategory(place) {
      const categoryValue = place.category || place.loai;
      return (categoryValue && categoryMap[categoryValue]) || 'other';
    }

    window.loadPlaces = async function() {
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const statsEl = document.getElementById('stats');
      const resultsEl = document.getElementById('results');

      loadingEl.style.display = 'block';
      errorEl.style.display = 'none';
      statsEl.style.display = 'none';
      resultsEl.style.display = 'none';

      try {
        const placesSnapshot = await getDocs(collection(db, 'places'));
        const places = [];
        
        placesSnapshot.forEach(doc => {
          places.push({ id: doc.id, ...doc.data() });
        });

        // Phân loại places theo normalized category
        const categorized = {};
        const unmapped = [];

        places.forEach(place => {
          const normalized = normalizeCategory(place);
          const originalCategory = place.category || place.loai || '(không có)';

          if (normalized === 'other' && originalCategory !== 'other') {
            unmapped.push({ ...place, originalCategory });
          }

          if (!categorized[normalized]) {
            categorized[normalized] = [];
          }
          categorized[normalized].push({ ...place, originalCategory });
        });

        // Hiển thị stats
        statsEl.innerHTML = `
          <div class="stats">
            <div class="stat-card">
              <div class="stat-value">${places.length}</div>
              <div class="stat-label">Tổng số địa điểm</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${Object.keys(categorized).length}</div>
              <div class="stat-label">Số category</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${unmapped.length}</div>
              <div class="stat-label">Chưa map đúng</div>
            </div>
          </div>
        `;

        // Hiển thị chi tiết
        let html = '';

        // Hiển thị unmapped places trước (quan trọng nhất)
        if (unmapped.length > 0) {
          html += `
            <div class="category-section">
              <div class="category-header">
                <div class="category-name">⚠️ Địa điểm chưa map đúng category</div>
                <div class="category-count">${unmapped.length}</div>
              </div>
              <div class="places-list">
          `;

          unmapped.forEach(place => {
            html += `
              <div class="place-item unmapped">
                <div class="place-name">${place.name || '(không có tên)'}</div>
                <div class="place-category">
                  Original: "${place.originalCategory}" → Mapped to: "other"
                </div>
              </div>
            `;
          });

          html += `
              </div>
            </div>
          `;
        }

        // Hiển thị các category đã map
        Object.keys(categorized).sort().forEach(category => {
          const categoryPlaces = categorized[category];
          
          html += `
            <div class="category-section">
              <div class="category-header">
                <div class="category-name">${category}</div>
                <div class="category-count">${categoryPlaces.length}</div>
              </div>
              <div class="places-list">
          `;

          categoryPlaces.slice(0, 10).forEach(place => {
            html += `
              <div class="place-item">
                <div class="place-name">${place.name || '(không có tên)'}</div>
                <div class="place-category">Original: "${place.originalCategory}"</div>
              </div>
            `;
          });

          if (categoryPlaces.length > 10) {
            html += `
              <div class="place-item">
                <div class="place-name">... và ${categoryPlaces.length - 10} địa điểm khác</div>
              </div>
            `;
          }

          html += `
              </div>
            </div>
          `;
        });

        resultsEl.innerHTML = html;

        loadingEl.style.display = 'none';
        statsEl.style.display = 'block';
        resultsEl.style.display = 'block';

      } catch (error) {
        console.error('Error:', error);
        errorEl.innerHTML = `<div class="error">❌ Lỗi: ${error.message}</div>`;
        errorEl.style.display = 'block';
        loadingEl.style.display = 'none';
      }
    };

    // Auto load on page load
    window.loadPlaces();
  </script>
</body>
</html>
