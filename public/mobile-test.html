<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVU Connect - Mobile Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .test-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .test-title {
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .status.success {
            background: #10b981;
        }
        
        .status.error {
            background: #ef4444;
        }
        
        .status.pending {
            background: #f59e0b;
        }
        
        .test-result {
            font-size: 14px;
            opacity: 0.9;
            margin-top: 8px;
            padding: 8px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            font-family: monospace;
        }
        
        button {
            width: 100%;
            padding: 16px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .info {
            font-size: 12px;
            opacity: 0.8;
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 TVU Connect Mobile Test</h1>
        
        <div class="test-card">
            <div class="test-title">
                <span class="status pending" id="status-device"></span>
                Device Info
            </div>
            <div class="test-result" id="result-device">Testing...</div>
        </div>
        
        <div class="test-card">
            <div class="test-title">
                <span class="status pending" id="status-browser"></span>
                Browser Support
            </div>
            <div class="test-result" id="result-browser">Testing...</div>
        </div>
        
        <div class="test-card">
            <div class="test-title">
                <span class="status pending" id="status-storage"></span>
                Storage APIs
            </div>
            <div class="test-result" id="result-storage">Testing...</div>
        </div>
        
        <div class="test-card">
            <div class="test-title">
                <span class="status pending" id="status-network"></span>
                Network
            </div>
            <div class="test-result" id="result-network">Testing...</div>
        </div>
        
        <div class="test-card">
            <div class="test-title">
                <span class="status pending" id="status-performance"></span>
                Performance
            </div>
            <div class="test-result" id="result-performance">Testing...</div>
        </div>
        
        <button onclick="window.location.href='/'">
            ✅ Tests Passed - Go to App
        </button>
        
        <div class="info">
            Nếu tất cả tests đều xanh, app sẽ hoạt động tốt trên thiết bị này.
        </div>
    </div>
    
    <script>
        // Test 1: Device Info
        function testDevice() {
            const info = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                screen: `${window.screen.width}x${window.screen.height}`,
                memory: navigator.deviceMemory || 'Unknown',
                cores: navigator.hardwareConcurrency || 'Unknown',
                online: navigator.onLine
            };
            
            document.getElementById('result-device').innerHTML = 
                `Platform: ${info.platform}<br>` +
                `Screen: ${info.screen}<br>` +
                `Memory: ${info.memory} GB<br>` +
                `Cores: ${info.cores}<br>` +
                `Online: ${info.online ? 'Yes' : 'No'}`;
            
            document.getElementById('status-device').className = 'status success';
        }
        
        // Test 2: Browser Support
        function testBrowser() {
            const support = {
                serviceWorker: 'serviceWorker' in navigator,
                indexedDB: 'indexedDB' in window,
                localStorage: 'localStorage' in window,
                fetch: 'fetch' in window,
                promise: 'Promise' in window,
                intersectionObserver: 'IntersectionObserver' in window
            };
            
            const allSupported = Object.values(support).every(v => v);
            
            document.getElementById('result-browser').innerHTML = 
                `Service Worker: ${support.serviceWorker ? '✅' : '❌'}<br>` +
                `IndexedDB: ${support.indexedDB ? '✅' : '❌'}<br>` +
                `LocalStorage: ${support.localStorage ? '✅' : '❌'}<br>` +
                `Fetch API: ${support.fetch ? '✅' : '❌'}<br>` +
                `Promises: ${support.promise ? '✅' : '❌'}<br>` +
                `IntersectionObserver: ${support.intersectionObserver ? '✅' : '❌'}`;
            
            document.getElementById('status-browser').className = 
                allSupported ? 'status success' : 'status error';
        }
        
        // Test 3: Storage APIs
        function testStorage() {
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                
                const quota = navigator.storage && navigator.storage.estimate 
                    ? 'Available' 
                    : 'Not available';
                
                document.getElementById('result-storage').innerHTML = 
                    `LocalStorage: ✅ Working<br>` +
                    `Storage API: ${quota}`;
                
                document.getElementById('status-storage').className = 'status success';
            } catch (e) {
                document.getElementById('result-storage').innerHTML = 
                    `Error: ${e.message}`;
                document.getElementById('status-storage').className = 'status error';
            }
        }
        
        // Test 4: Network
        function testNetwork() {
            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            
            if (connection) {
                document.getElementById('result-network').innerHTML = 
                    `Type: ${connection.effectiveType || 'Unknown'}<br>` +
                    `Downlink: ${connection.downlink || 'Unknown'} Mbps<br>` +
                    `RTT: ${connection.rtt || 'Unknown'} ms<br>` +
                    `Save Data: ${connection.saveData ? 'Yes' : 'No'}`;
            } else {
                document.getElementById('result-network').innerHTML = 
                    'Network API not supported';
            }
            
            document.getElementById('status-network').className = 'status success';
        }
        
        // Test 5: Performance
        function testPerformance() {
            const memory = performance.memory;
            const timing = performance.timing;
            
            let result = '';
            
            if (memory) {
                result += `Memory Used: ${Math.round(memory.usedJSHeapSize / 1048576)} MB<br>`;
                result += `Memory Limit: ${Math.round(memory.jsHeapSizeLimit / 1048576)} MB<br>`;
            }
            
            if (timing) {
                const loadTime = timing.loadEventEnd - timing.navigationStart;
                result += `Page Load: ${loadTime} ms`;
            }
            
            if (!result) {
                result = 'Performance API not fully supported';
            }
            
            document.getElementById('result-performance').innerHTML = result;
            document.getElementById('status-performance').className = 'status success';
        }
        
        // Run all tests
        setTimeout(() => {
            testDevice();
            testBrowser();
            testStorage();
            testNetwork();
            testPerformance();
        }, 500);
    </script>
</body>
</html>
