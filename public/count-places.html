<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đếm số địa điểm - TVU Connect</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      text-align: center;
      margin-bottom: 30px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    .stat-number {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.9;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    #result {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      white-space: pre-wrap;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
    }
    .error {
      background: #fee;
      color: #c33;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
    }
    .success {
      background: #efe;
      color: #3c3;
      padding: 15px;
      border-radius: 8px;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Kiểm tra số lượng địa điểm</h1>
    
    <div class="stats" id="stats" style="display: none;">
      <div class="stat-card">
        <div class="stat-label">Tổng số địa điểm</div>
        <div class="stat-number" id="totalPlaces">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Có tọa độ hợp lệ</div>
        <div class="stat-number" id="validPlaces">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Thiếu tọa độ</div>
        <div class="stat-number" id="invalidPlaces">0</div>
      </div>
    </div>

    <button onclick="countPlaces()">📊 Đếm địa điểm</button>
    <button onclick="showDetails()">📋 Xem chi tiết</button>
    
    <div id="result"></div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDXzKJCWbP5vH_Aq7bnVLlZHxh8Aq-KCQY",
      authDomain: "tvu-student-connect.firebaseapp.com",
      projectId: "tvu-student-connect",
      storageBucket: "tvu-student-connect.firebasestorage.app",
      messagingSenderId: "1069635774630",
      appId: "1:1069635774630:web:5e7e3f3e3e3e3e3e3e3e3e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let placesData = [];

    window.countPlaces = async function() {
      const resultDiv = document.getElementById('result');
      const statsDiv = document.getElementById('stats');
      
      try {
        resultDiv.innerHTML = '<div class="success">⏳ Đang tải dữ liệu từ Firestore...</div>';
        
        const querySnapshot = await getDocs(collection(db, 'places'));
        placesData = [];
        
        let totalPlaces = 0;
        let validPlaces = 0;
        let invalidPlaces = 0;
        
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          totalPlaces++;
          
          const hasValidLocation = data.location && 
                                   typeof data.location.lat === 'number' && 
                                   typeof data.location.lng === 'number';
          
          if (hasValidLocation) {
            validPlaces++;
          } else {
            invalidPlaces++;
          }
          
          placesData.push({
            id: doc.id,
            name: data.name || data.tên || 'Chưa có tên',
            category: data.category || data.loại || 'other',
            hasLocation: hasValidLocation,
            location: data.location
          });
        });
        
        // Update stats
        document.getElementById('totalPlaces').textContent = totalPlaces;
        document.getElementById('validPlaces').textContent = validPlaces;
        document.getElementById('invalidPlaces').textContent = invalidPlaces;
        statsDiv.style.display = 'grid';
        
        resultDiv.innerHTML = `
          <div class="success">
            ✅ Đã tải xong!
            
            📊 Thống kê:
            - Tổng số địa điểm: ${totalPlaces}
            - Có tọa độ hợp lệ: ${validPlaces}
            - Thiếu tọa độ: ${invalidPlaces}
            
            ${invalidPlaces > 0 ? '⚠️ Có ' + invalidPlaces + ' địa điểm thiếu tọa độ sẽ không hiển thị trên bản đồ!' : ''}
          </div>
        `;
        
      } catch (error) {
        resultDiv.innerHTML = `<div class="error">❌ Lỗi: ${error.message}</div>`;
        console.error('Error:', error);
      }
    };

    window.showDetails = function() {
      const resultDiv = document.getElementById('result');
      
      if (placesData.length === 0) {
        resultDiv.innerHTML = '<div class="error">⚠️ Vui lòng bấm "Đếm địa điểm" trước!</div>';
        return;
      }
      
      let output = '📋 CHI TIẾT CÁC ĐỊA ĐIỂM:\n\n';
      
      // Group by category
      const byCategory = {};
      placesData.forEach(place => {
        const cat = place.category || 'other';
        if (!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(place);
      });
      
      Object.keys(byCategory).sort().forEach(category => {
        output += `\n📁 ${category.toUpperCase()} (${byCategory[category].length} địa điểm)\n`;
        output += '─'.repeat(60) + '\n';
        
        byCategory[category].forEach((place, index) => {
          output += `${index + 1}. ${place.name}\n`;
          output += `   ID: ${place.id}\n`;
          output += `   Tọa độ: ${place.hasLocation ? '✅ Có' : '❌ Thiếu'}\n`;
          if (place.hasLocation) {
            output += `   Lat: ${place.location.lat}, Lng: ${place.location.lng}\n`;
          }
          output += '\n';
        });
      });
      
      // Show places without location
      const noLocation = placesData.filter(p => !p.hasLocation);
      if (noLocation.length > 0) {
        output += '\n\n⚠️ CÁC ĐỊA ĐIỂM THIẾU TỌA ĐỘ:\n';
        output += '─'.repeat(60) + '\n';
        noLocation.forEach((place, index) => {
          output += `${index + 1}. ${place.name} (${place.category})\n`;
          output += `   ID: ${place.id}\n\n`;
        });
      }
      
      resultDiv.textContent = output;
    };
  </script>
</body>
</html>
