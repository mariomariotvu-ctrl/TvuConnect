<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cập nhật Profile cho Fake Users - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
      font-size: 14px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress {
      margin-top: 20px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
      display: none;
    }
    .progress.show {
      display: block;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
      width: 0%;
    }
    .log {
      max-height: 300px;
      overflow-y: auto;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      color: #475569;
      line-height: 1.6;
    }
    .log-item {
      padding: 4px 0;
    }
    .log-item.success { color: #10b981; }
    .log-item.error { color: #ef4444; }
    .log-item.warning { color: #f59e0b; }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }
    .stat {
      text-align: center;
      padding: 12px;
      background: white;
      border-radius: 8px;
    }
    .stat-value {
      font-size: 24px;
      font-weight: 900;
      color: #667eea;
    }
    .stat-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 Cập nhật Profile Fake Users</h1>
    <p class="subtitle">Tự động tạo profile đầy đủ cho tất cả fake users</p>

    <div class="input-group">
      <label>Số thứ tự bắt đầu (Start Index)</label>
      <input type="number" id="startIndex" value="1" min="1" max="100">
    </div>

    <div class="input-group">
      <label>Số thứ tự kết thúc (End Index)</label>
      <input type="number" id="endIndex" value="50" min="1" max="100">
    </div>

    <button id="startBtn" onclick="startUpdate()">
      🚀 Bắt đầu cập nhật
    </button>

    <div class="progress" id="progress">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stats">
        <div class="stat">
          <div class="stat-value" id="successCount">0</div>
          <div class="stat-label">Thành công</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="errorCount">0</div>
          <div class="stat-label">Lỗi</div>
        </div>
        <div class="stat">
          <div class="stat-value" id="totalCount">0</div>
          <div class="stat-label">Tổng cộng</div>
        </div>
      </div>
      <div class="log" id="log"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
    import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyByuf-sL2MfEE2zE4reYHxqAGlDg5CcJ9w",
      authDomain: "gen-lang-client-0050597412.firebaseapp.com",
      projectId: "gen-lang-client-0050597412",
      storageBucket: "gen-lang-client-0050597412.firebasestorage.app",
      messagingSenderId: "43871673395",
      appId: "1:43871673395:web:00e950c3694f2a49291746",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Data generators
    const firstNames = ['Minh', 'Hương', 'Tuấn', 'Linh', 'Khoa', 'Trang', 'Dũng', 'Hà', 'Phúc', 'Mai', 'Hoàng', 'Lan', 'Quân', 'Thảo', 'Hải', 'Ngọc', 'Bảo', 'Vy', 'Long', 'Anh', 'Nam', 'Huyền', 'Đức', 'Phương'];
    const lastNames = ['Nguyễn', 'Trần', 'Lê', 'Phạm', 'Hoàng', 'Huỳnh', 'Phan', 'Vũ', 'Võ', 'Đặng', 'Bùi', 'Đỗ', 'Hồ', 'Ngô', 'Dương', 'Lý'];
    const faculties = ['Công nghệ thông tin', 'Kinh tế', 'Ngoại ngữ', 'Sư phạm', 'Kỹ thuật công nghệ', 'Khoa học tự nhiên', 'Nông nghiệp', 'Luật'];
    const classes = ['CNTT1', 'CNTT2', 'CNTT3', 'CNTT4', 'KT1', 'KT2', 'KT3', 'NN1', 'NN2', 'NN3', 'SP1', 'SP2', 'KTCN1', 'KTCN2', 'KHTN1', 'KHTN2'];
    const hobbies = ['Đọc sách', 'Nghe nhạc', 'Xem phim', 'Thể thao', 'Du lịch', 'Chụp ảnh', 'Nấu ăn', 'Vẽ', 'Chơi game', 'Âm nhạc', 'Múa', 'Ca hát', 'Lập trình', 'Thiết kế', 'Viết blog', 'Bóng đá', 'Bóng rổ', 'Cầu lông', 'Yoga', 'Gym', 'Chạy bộ'];
    const bios = ['Mình là sinh viên TVU, thích làm quen bạn mới!', 'Yêu thích học tập và khám phá điều mới.', 'Tìm bạn cùng sở thích để cùng nhau phát triển.', 'Mình rất thân thiện và hòa đồng nha!', 'Thích đi cafe và tán gẫu với bạn bè.', 'Đam mê công nghệ và sáng tạo.', 'Mong muốn kết nối với nhiều bạn trong trường.'];
    const personalities = ['Hòa đồng', 'Vui vẻ', 'Năng động', 'Chân thành', 'Nhiệt tình', 'Thân thiện', 'Sáng tạo', 'Tích cực', 'Lạc quan', 'Chu đáo', 'Tận tâm', 'Trách nhiệm', 'Hài hước', 'Dễ gần', 'Cởi mở'];
    const goals = ['Tìm bạn học nhóm', 'Kết bạn mới', 'Phát triển kỹ năng', 'Tìm người yêu', 'Tìm bạn thân', 'Giao lưu văn hóa', 'Học tập', 'Rèn luyện', 'Khám phá', 'Kết nối', 'Chia sẻ', 'Hỗ trợ lẫn nhau'];
    const genders = ['male', 'female'];
    const birthYears = [1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006];
    const academicYears = ['2020-2024', '2021-2025', '2022-2026', '2023-2027'];
    const zodiacSigns = ['Bạch Dương', 'Kim Ngưu', 'Song Tử', 'Cự Giải', 'Sư Tử', 'Xử Nữ', 'Thiên Bình', 'Bọ Cạp', 'Nhân Mã', 'Ma Kết', 'Bảo Bình', 'Song Ngư'];
    const studyGoals = ['Học nhóm', 'Ôn thi', 'Làm đồ án', 'Nghiên cứu', 'Thực hành'];

    const random = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const randomMultiple = (arr, count) => {
      const shuffled = [...arr].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    };

    const generateMSSV = (index) => {
      const year = random([21, 22, 23, 24]);
      const code = String(1000000 + index).padStart(7, '0');
      return `${year}${code}`;
    };

    const generatePhone = () => {
      const prefixes = ['032', '033', '034', '035', '036', '037', '038', '039', '070', '076', '077', '078', '079', '081', '082', '083', '084', '085', '086', '088', '089', '090', '091', '092', '093', '094', '096', '097', '098', '099'];
      const prefix = random(prefixes);
      const number = Math.floor(Math.random() * 9000000) + 1000000;
      return `${prefix}${number}`;
    };

    const calculateAge = (birthYear) => new Date().getFullYear() - birthYear;

    const generateProfile = (index, uid) => {
      const firstName = random(firstNames);
      const lastName = random(lastNames);
      const fullName = `${lastName} ${firstName}`;
      const gender = random(genders);
      const birthYear = random(birthYears);
      
      return {
        uid,
        email: `fakeuser${index}@tvu.edu.vn`,
        fullName,
        mssv: generateMSSV(index),
        className: random(classes),
        phone: generatePhone(),
        gender,
        major: random(faculties),
        academicYear: random(academicYears),
        birthYear,
        age: calculateAge(birthYear),
        interests: randomMultiple(hobbies, 3),
        bio: random(bios),
        personality: randomMultiple(personalities, 3),
        goals: randomMultiple(goals, 2),
        zodiac: random(zodiacSigns),
        studyGoals: randomMultiple(studyGoals, 2),
        isOnline: false,
        photoURL: '',
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
      };
    };

    const log = (message, type = 'info') => {
      const logEl = document.getElementById('log');
      const item = document.createElement('div');
      item.className = `log-item ${type}`;
      item.textContent = message;
      logEl.appendChild(item);
      logEl.scrollTop = logEl.scrollHeight;
    };

    const updateStats = (success, error, total) => {
      document.getElementById('successCount').textContent = success;
      document.getElementById('errorCount').textContent = error;
      document.getElementById('totalCount').textContent = total;
    };

    const updateProgress = (current, total) => {
      const percent = (current / total) * 100;
      document.getElementById('progressFill').style.width = `${percent}%`;
    };

    window.startUpdate = async () => {
      const startIndex = parseInt(document.getElementById('startIndex').value);
      const endIndex = parseInt(document.getElementById('endIndex').value);
      
      if (startIndex > endIndex) {
        alert('Số bắt đầu phải nhỏ hơn số kết thúc!');
        return;
      }

      const total = endIndex - startIndex + 1;
      let success = 0;
      let error = 0;

      document.getElementById('startBtn').disabled = true;
      document.getElementById('progress').classList.add('show');
      document.getElementById('log').innerHTML = '';

      log(`🚀 Bắt đầu cập nhật ${total} profiles...`, 'info');

      for (let i = startIndex; i <= endIndex; i++) {
        const email = `fakeuser${i}@tvu.edu.vn`;
        const password = 'Test123456';

        try {
          log(`⏳ ${i}. Đang xử lý ${email}...`, 'info');
          
          // Login
          const userCredential = await signInWithEmailAndPassword(auth, email, password);
          const uid = userCredential.user.uid;
          log(`   → Đã login (UID: ${uid.substring(0, 8)}...)`, 'info');

          // Generate and save profile
          const profileData = generateProfile(i, uid);
          await setDoc(doc(db, 'profiles', uid), profileData);
          log(`   → Đã lưu profile`, 'info');

          success++;
          log(`✅ ${i}. ${profileData.fullName} - ${profileData.mssv}`, 'success');
        } catch (err) {
          error++;
          console.error(`Error at ${i}:`, err);
          
          if (err.code === 'auth/user-not-found') {
            log(`⚠️ ${i}. ${email} - Chưa tạo user`, 'warning');
          } else if (err.code === 'auth/wrong-password') {
            log(`❌ ${i}. ${email} - Sai password`, 'error');
          } else if (err.code === 'auth/too-many-requests') {
            log(`❌ ${i}. ${email} - Quá nhiều request, dừng lại`, 'error');
            log(`⚠️ Bị rate limit! Hãy đợi 5 phút rồi thử lại`, 'warning');
            break;
          } else if (err.code === 'permission-denied') {
            log(`❌ ${i}. ${email} - Firestore rules chặn`, 'error');
          } else {
            log(`❌ ${i}. ${email} - ${err.code || err.message}`, 'error');
          }
        }

        updateStats(success, error, i - startIndex + 1);
        updateProgress(i - startIndex + 1, total);

        // Delay to avoid rate limit (tăng lên 1.5 giây)
        await new Promise(resolve => setTimeout(resolve, 1500));
      }

      log(`\n✨ Hoàn thành! Thành công: ${success}/${total}`, 'success');
      if (error > 0) {
        log(`⚠️ Có ${error} lỗi. Kiểm tra log phía trên để biết chi tiết.`, 'warning');
      }
      document.getElementById('startBtn').disabled = false;
    };
  </script>
</body>
</html>
