<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 Google Drive API Debug Tool</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 32px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    
    .section {
      margin-bottom: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    
    .section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .label {
      font-weight: 600;
      color: #555;
    }
    
    .value {
      color: #333;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }
    
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status.warning {
      background: #fff3cd;
      color: #856404;
    }
    
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
      margin-top: 10px;
    }
    
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      max-height: 400px;
      overflow-y: auto;
      margin-top: 20px;
    }
    
    .log-entry {
      margin-bottom: 8px;
      padding: 4px 0;
    }
    
    .log-time {
      color: #858585;
    }
    
    .log-success {
      color: #4ec9b0;
    }
    
    .log-error {
      color: #f48771;
    }
    
    .log-info {
      color: #569cd6;
    }
    
    .alert {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .alert-warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }
    
    code {
      background: #f4f4f4;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Google Drive API Debug</h1>
    <p class="subtitle">Tool kiểm tra chi tiết lỗi Google Drive API</p>
    
    <div id="configStatus" class="section">
      <h2>📋 Cấu hình</h2>
      <div class="info-row">
        <span class="label">Client ID:</span>
        <span class="value" id="clientId">Đang kiểm tra...</span>
      </div>
      <div class="info-row">
        <span class="label">API Key:</span>
        <span class="value" id="apiKey">Đang kiểm tra...</span>
      </div>
      <div class="info-row">
        <span class="label">Current URL:</span>
        <span class="value" id="currentUrl">-</span>
      </div>
    </div>
    
    <div id="gapiStatus" class="section">
      <h2>🔌 Google API Status</h2>
      <div class="info-row">
        <span class="label">GAPI Loaded:</span>
        <span class="value" id="gapiLoaded">-</span>
      </div>
      <div class="info-row">
        <span class="label">GAPI Initialized:</span>
        <span class="value" id="gapiInit">-</span>
      </div>
      <div class="info-row">
        <span class="label">Auth Status:</span>
        <span class="value" id="authStatus">-</span>
      </div>
    </div>
    
    <button id="testBtn" onclick="runTest()">🚀 Chạy Test</button>
    <button id="authBtn" onclick="testAuth()" style="display:none;">🔐 Test Authentication</button>
    
    <div id="alertBox"></div>
    
    <div class="log" id="logBox">
      <div class="log-entry">
        <span class="log-time">[00:00:00]</span>
        <span class="log-info">Sẵn sàng để test...</span>
      </div>
    </div>
  </div>

  <script src="https://apis.google.com/js/api.js"></script>
  <script>
    // Config - Lấy từ .env.local
    const CLIENT_ID = 'YOUR_CLIENT_ID_HERE'; // Thay bằng Client ID thật
    const API_KEY = 'YOUR_API_KEY_HERE'; // Thay bằng API Key thật
    const SCOPES = 'https://www.googleapis.com/auth/drive.file';
    
    let gapiInited = false;
    let authInited = false;
    
    function log(message, type = 'info') {
      const logBox = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      entry.innerHTML = `
        <span class="log-time">[${time}]</span>
        <span class="log-${type}">${message}</span>
      `;
      logBox.appendChild(entry);
      logBox.scrollTop = logBox.scrollHeight;
    }
    
    function showAlert(message, type = 'info') {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `
        <div class="alert alert-${type}">
          ${message}
        </div>
      `;
    }
    
    function updateStatus() {
      // Config status
      document.getElementById('clientId').textContent = CLIENT_ID.substring(0, 20) + '...';
      document.getElementById('apiKey').textContent = API_KEY.substring(0, 20) + '...';
      document.getElementById('currentUrl').textContent = window.location.origin;
      
      // GAPI status
      document.getElementById('gapiLoaded').innerHTML = 
        typeof gapi !== 'undefined' 
          ? '<span class="status success">✅ Loaded</span>' 
          : '<span class="status error">❌ Not Loaded</span>';
      
      document.getElementById('gapiInit').innerHTML = 
        gapiInited 
          ? '<span class="status success">✅ Initialized</span>' 
          : '<span class="status warning">⏳ Not Initialized</span>';
      
      if (gapiInited && gapi.auth2) {
        const authInstance = gapi.auth2.getAuthInstance();
        const isSignedIn = authInstance && authInstance.isSignedIn.get();
        document.getElementById('authStatus').innerHTML = 
          isSignedIn 
            ? '<span class="status success">✅ Signed In</span>' 
            : '<span class="status warning">⏳ Not Signed In</span>';
      } else {
        document.getElementById('authStatus').innerHTML = 
          '<span class="status warning">⏳ Waiting</span>';
      }
    }
    
    async function runTest() {
      log('🚀 Bắt đầu test...', 'info');
      document.getElementById('testBtn').disabled = true;
      
      try {
        // Step 1: Check GAPI
        log('📦 Kiểm tra GAPI...', 'info');
        if (typeof gapi === 'undefined') {
          throw new Error('GAPI chưa được load! Kiểm tra script tag.');
        }
        log('✅ GAPI đã load', 'success');
        
        // Step 2: Load client
        log('🔄 Đang load gapi.client...', 'info');
        await new Promise((resolve) => {
          gapi.load('client:auth2', resolve);
        });
        log('✅ gapi.client đã load', 'success');
        
        // Step 3: Initialize
        log('⚙️ Đang khởi tạo Google API...', 'info');
        log(`📍 Client ID: ${CLIENT_ID.substring(0, 30)}...`, 'info');
        log(`📍 API Key: ${API_KEY.substring(0, 30)}...`, 'info');
        log(`📍 Redirect URI: ${window.location.origin}`, 'info');
        
        await gapi.client.init({
          apiKey: API_KEY,
          clientId: CLIENT_ID,
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'],
          scope: SCOPES,
        });
        
        gapiInited = true;
        log('✅ Google API đã khởi tạo thành công!', 'success');
        
        // Step 4: Check auth
        const authInstance = gapi.auth2.getAuthInstance();
        const isSignedIn = authInstance.isSignedIn.get();
        
        if (isSignedIn) {
          const user = authInstance.currentUser.get();
          const profile = user.getBasicProfile();
          log(`✅ Đã đăng nhập: ${profile.getEmail()}`, 'success');
          showAlert('✅ Test thành công! Google Drive API hoạt động bình thường.', 'success');
        } else {
          log('⚠️ Chưa đăng nhập', 'warning');
          showAlert('⚠️ API đã khởi tạo nhưng chưa đăng nhập. Click "Test Authentication" để đăng nhập.', 'warning');
          document.getElementById('authBtn').style.display = 'block';
        }
        
        updateStatus();
        
      } catch (error) {
        log(`❌ LỖI: ${error.message}`, 'error');
        log(`📋 Chi tiết: ${JSON.stringify(error, null, 2)}`, 'error');
        
        // Phân tích lỗi
        if (error.error === 'idpiframe_initialization_failed') {
          showAlert(`
            <strong>❌ Lỗi khởi tạo OAuth!</strong><br><br>
            <strong>Nguyên nhân có thể:</strong><br>
            1. <strong>Email chưa được thêm vào Test Users</strong> (phổ biến nhất!)<br>
            2. Redirect URI chưa được config đúng<br>
            3. Client ID hoặc API Key sai<br><br>
            <strong>Giải pháp:</strong><br>
            1. Vào <a href="https://console.cloud.google.com/apis/credentials/consent" target="_blank">OAuth consent screen</a><br>
            2. Thêm email của bạn vào <strong>Test users</strong><br>
            3. Kiểm tra <strong>Authorized JavaScript origins</strong> có <code>${window.location.origin}</code><br>
            4. Kiểm tra <strong>Authorized redirect URIs</strong> có <code>${window.location.origin}</code>
          `, 'error');
        } else if (error.error === 'popup_closed_by_user') {
          showAlert('⚠️ Bạn đã đóng popup đăng nhập.', 'warning');
        } else {
          showAlert(`❌ Lỗi: ${error.message}`, 'error');
        }
        
        updateStatus();
      } finally {
        document.getElementById('testBtn').disabled = false;
      }
    }
    
    async function testAuth() {
      log('🔐 Đang test authentication...', 'info');
      document.getElementById('authBtn').disabled = true;
      
      try {
        const authInstance = gapi.auth2.getAuthInstance();
        
        log('📱 Mở popup đăng nhập...', 'info');
        await authInstance.signIn({
          prompt: 'select_account'
        });
        
        const user = authInstance.currentUser.get();
        const profile = user.getBasicProfile();
        
        log(`✅ Đăng nhập thành công!`, 'success');
        log(`👤 Email: ${profile.getEmail()}`, 'success');
        log(`👤 Tên: ${profile.getName()}`, 'success');
        
        showAlert(`✅ Đăng nhập thành công!<br>Email: ${profile.getEmail()}`, 'success');
        
        updateStatus();
        
      } catch (error) {
        log(`❌ Lỗi đăng nhập: ${error.error}`, 'error');
        
        if (error.error === 'popup_closed_by_user') {
          showAlert('⚠️ Bạn đã đóng popup đăng nhập.', 'warning');
        } else if (error.error === 'access_denied') {
          showAlert(`
            <strong>❌ Truy cập bị từ chối!</strong><br><br>
            <strong>Email của bạn chưa được thêm vào Test Users!</strong><br><br>
            <strong>Giải pháp:</strong><br>
            1. Vào <a href="https://console.cloud.google.com/apis/credentials/consent" target="_blank">OAuth consent screen</a><br>
            2. Click <strong>ADD USERS</strong><br>
            3. Thêm email: <code>${error.details || 'your-email@gmail.com'}</code><br>
            4. Save và thử lại
          `, 'error');
        } else {
          showAlert(`❌ Lỗi: ${error.error}`, 'error');
        }
      } finally {
        document.getElementById('authBtn').disabled = false;
      }
    }
    
    // Initialize
    updateStatus();
    
    // Auto-update status every 2 seconds
    setInterval(updateStatus, 2000);
  </script>
</body>
</html>
