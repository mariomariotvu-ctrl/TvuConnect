<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Trending Score Algorithm</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #9333EA;
            padding-bottom: 10px;
        }
        .test-case {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .post {
            background: #f9fafb;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #9333EA;
            border-radius: 8px;
        }
        .post.top {
            background: #fef3c7;
            border-left-color: #f59e0b;
        }
        .score {
            font-weight: bold;
            color: #9333EA;
            font-size: 18px;
        }
        .details {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
        button {
            background: linear-gradient(135deg, #9333EA 0%, #0EA5E9 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
        }
        button:hover {
            opacity: 0.9;
        }
        .result {
            background: #e0f2fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .pass {
            color: #059669;
            font-weight: bold;
        }
        .fail {
            color: #dc2626;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🔥 Test Trending Score Algorithm</h1>
    
    <div class="test-case">
        <h2>Test 1: Bài có engagement khác nhau</h2>
        <div id="test1-result"></div>
        <button onclick="runTest1()">Chạy Test 1</button>
    </div>

    <div class="test-case">
        <h2>Test 2: Bài không có tương tác</h2>
        <div id="test2-result"></div>
        <button onclick="runTest2()">Chạy Test 2</button>
    </div>

    <div class="test-case">
        <h2>Test 3: Bài cũ vs Bài mới</h2>
        <div id="test3-result"></div>
        <button onclick="runTest3()">Chạy Test 3</button>
    </div>

    <div class="test-case">
        <h2>Test 4: Comments vs Reactions</h2>
        <div id="test4-result"></div>
        <button onclick="runTest4()">Chạy Test 4</button>
    </div>

    <button onclick="runAllTests()" style="background: #059669; width: 100%; margin-top: 20px;">
        ▶️ Chạy tất cả tests
    </button>

    <script>
        // Trending Score Algorithm (copy từ src/utils/trendingScore.ts)
        function calculateTrendingScore(post, config = {}) {
            const cfg = {
                commentWeight: 2,
                timeDecayFactor: 2,
                minEngagement: 1,
                ...config
            };

            // Calculate engagement
            const reactionCount = Array.isArray(post.reactions) ? post.reactions.length : 0;
            const commentCount = post.commentCount || 0;
            const engagement = reactionCount + (commentCount * cfg.commentWeight);

            // Calculate age in hours
            const now = Date.now();
            const postDate = new Date(post.createdAt);
            const ageInHours = (now - postDate.getTime()) / (1000 * 60 * 60);

            // Calculate score
            const engagementScore = Math.log10(Math.max(engagement, cfg.minEngagement));
            const ageScore = -(ageInHours / cfg.timeDecayFactor);
            
            return engagementScore + ageScore;
        }

        function sortPostsByTrending(posts, config = {}) {
            return [...posts].sort((a, b) => {
                const scoreA = calculateTrendingScore(a, config);
                const scoreB = calculateTrendingScore(b, config);
                return scoreB - scoreA;
            });
        }

        function createPost(content, reactions, comments, hoursAgo) {
            return {
                id: Math.random().toString(36),
                content,
                reactions: Array(reactions).fill({ userId: 'user' }),
                commentCount: comments,
                createdAt: new Date(Date.now() - hoursAgo * 60 * 60 * 1000)
            };
        }

        function displayPosts(posts, containerId) {
            const container = document.getElementById(containerId);
            let html = '';
            
            posts.forEach((post, index) => {
                const score = calculateTrendingScore(post);
                const isTop = index === 0;
                const reactionCount = post.reactions ? post.reactions.length : 0;
                const ageHours = (Date.now() - new Date(post.createdAt).getTime()) / (1000 * 60 * 60);
                
                html += `
                    <div class="post ${isTop ? 'top' : ''}">
                        <div><strong>${index + 1}. ${post.content}</strong> ${isTop ? '🏆' : ''}</div>
                        <div class="score">Điểm: ${score.toFixed(4)}</div>
                        <div class="details">
                            ${reactionCount} reactions + ${post.commentCount} comments 
                            (engagement: ${reactionCount + post.commentCount * 2}) 
                            | ${ageHours.toFixed(1)} giờ trước
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        function runTest1() {
            console.log('Running Test 1...');
            const posts = [
                createPost('Bài A: Mới, ít tương tác', 2, 0, 0.5),
                createPost('Bài B: Cũ, nhiều tương tác', 15, 5, 3),
                createPost('Bài C: Vừa mới, vừa hot', 8, 2, 1)
            ];
            
            const sorted = sortPostsByTrending(posts);
            displayPosts(sorted, 'test1-result');
            
            // Verify: Bài C phải lên top
            const pass = sorted[0].content.includes('Bài C');
            console.log('Test 1:', pass ? 'PASS ✅' : 'FAIL ❌');
            return pass;
        }

        function runTest2() {
            console.log('Running Test 2...');
            const posts = [
                createPost('Bài D: Vừa đăng, 0 tương tác', 0, 0, 0.017),
                createPost('Bài E: 10 phút, 0 tương tác', 0, 0, 0.167),
                createPost('Bài F: 1 giờ, 0 tương tác', 0, 0, 1)
            ];
            
            const sorted = sortPostsByTrending(posts);
            displayPosts(sorted, 'test2-result');
            
            // Verify: Bài mới nhất phải lên top
            const pass = sorted[0].content.includes('Bài D');
            console.log('Test 2:', pass ? 'PASS ✅' : 'FAIL ❌');
            return pass;
        }

        function runTest3() {
            console.log('Running Test 3...');
            const posts = [
                createPost('Bài G: Mới 5 phút, 1 reaction', 1, 0, 0.083),
                createPost('Bài H: Cũ 5 giờ, 10 reactions', 10, 0, 5)
            ];
            
            const sorted = sortPostsByTrending(posts);
            displayPosts(sorted, 'test3-result');
            
            // Verify: Bài mới phải thắng
            const pass = sorted[0].content.includes('Bài G');
            console.log('Test 3:', pass ? 'PASS ✅' : 'FAIL ❌');
            return pass;
        }

        function runTest4() {
            console.log('Running Test 4...');
            const posts = [
                createPost('Bài I: 10 reactions, 0 comments', 10, 0, 1),
                createPost('Bài J: 5 reactions, 3 comments', 5, 3, 1)
            ];
            
            const sorted = sortPostsByTrending(posts);
            displayPosts(sorted, 'test4-result');
            
            // Verify: Bài J phải thắng (5 + 3*2 = 11 > 10)
            const pass = sorted[0].content.includes('Bài J');
            console.log('Test 4:', pass ? 'PASS ✅' : 'FAIL ❌');
            return pass;
        }

        function runAllTests() {
            console.log('=== Running All Tests ===');
            const results = [
                runTest1(),
                runTest2(),
                runTest3(),
                runTest4()
            ];
            
            const passCount = results.filter(r => r).length;
            const totalCount = results.length;
            
            alert(`Kết quả: ${passCount}/${totalCount} tests passed ${passCount === totalCount ? '✅' : '❌'}`);
        }
    </script>
</body>
</html>
