<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiểm tra tọa độ địa điểm - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .subtitle {
      opacity: 0.9;
      font-size: 14px;
    }
    .content {
      padding: 30px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 25px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
    }
    .stat-number {
      font-size: 48px;
      font-weight: bold;
      margin: 10px 0;
    }
    .stat-label {
      font-size: 14px;
      opacity: 0.95;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      transition: all 0.3s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .report {
      margin-top: 30px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      max-height: 600px;
      overflow-y: auto;
    }
    .report h2 {
      color: #667eea;
      margin-bottom: 15px;
      font-size: 20px;
    }
    .place-item {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      border-left: 4px solid #667eea;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .place-item.error {
      border-left-color: #e74c3c;
    }
    .place-item.warning {
      border-left-color: #f39c12;
    }
    .place-item.success {
      border-left-color: #27ae60;
    }
    .place-name {
      font-weight: bold;
      font-size: 16px;
      color: #2c3e50;
      margin-bottom: 8px;
    }
    .place-details {
      font-size: 13px;
      color: #7f8c8d;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      margin-right: 8px;
      margin-top: 5px;
    }
    .badge-error {
      background: #fee;
      color: #e74c3c;
    }
    .badge-warning {
      background: #fef5e7;
      color: #f39c12;
    }
    .badge-success {
      background: #eafaf1;
      color: #27ae60;
    }
    .loading {
      text-align: center;
      padding: 40px;
      color: #667eea;
      font-size: 18px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .summary {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 2px solid #667eea;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #ecf0f1;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-label {
      font-weight: 600;
      color: #2c3e50;
    }
    .summary-value {
      color: #667eea;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🗺️ Kiểm tra tọa độ địa điểm</h1>
      <p class="subtitle">Xác thực tọa độ GPS của tất cả địa điểm trong database</p>
    </div>

    <div class="content">
      <div class="stats-grid" id="stats" style="display: none;">
        <div class="stat-card">
          <div class="stat-label">Tổng số</div>
          <div class="stat-number" id="totalCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Hợp lệ ✅</div>
          <div class="stat-number" id="validCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Cảnh báo ⚠️</div>
          <div class="stat-number" id="warningCount">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Lỗi ❌</div>
          <div class="stat-number" id="errorCount">0</div>
        </div>
      </div>

      <button id="validateBtn" onclick="validateAllCoordinates()">
        🔍 Bắt đầu kiểm tra
      </button>

      <button id="exportBtn" onclick="exportReport()" style="display: none; background: #27ae60;">
        📥 Xuất báo cáo (JSON)
      </button>

      <div id="loading" style="display: none;" class="loading">
        <div class="spinner"></div>
        <p>Đang kiểm tra tọa độ...</p>
      </div>

      <div id="report"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDXzKJCWbP5vH_Aq7bnVLlZHxh8Aq-KCQY",
      authDomain: "tvu-student-connect.firebaseapp.com",
      projectId: "tvu-student-connect",
      storageBucket: "tvu-student-connect.firebasestorage.app",
      messagingSenderId: "1069635774630",
      appId: "1:1069635774630:web:5e7e3f3e3e3e3e3e3e3e3e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Tọa độ trung tâm Trà Vinh (để kiểm tra khoảng cách hợp lý)
    const TVU_CENTER = { lat: 9.9345, lng: 106.3461 };
    const MAX_REASONABLE_DISTANCE = 50; // km

    let validationResults = [];

    function calculateDistance(lat1, lng1, lat2, lng2) {
      const R = 6371; // Bán kính Trái Đất (km)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLng = (lng2 - lng1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function validateCoordinate(lat, lng) {
      const issues = [];
      
      // Kiểm tra kiểu dữ liệu
      if (typeof lat !== 'number' || typeof lng !== 'number') {
        issues.push({
          type: 'error',
          message: `Kiểu dữ liệu sai: lat=${typeof lat}, lng=${typeof lng}`
        });
        return issues;
      }

      // Kiểm tra NaN
      if (isNaN(lat) || isNaN(lng)) {
        issues.push({
          type: 'error',
          message: 'Tọa độ là NaN (Not a Number)'
        });
        return issues;
      }

      // Kiểm tra phạm vi hợp lệ
      if (lat < -90 || lat > 90) {
        issues.push({
          type: 'error',
          message: `Latitude ngoài phạm vi [-90, 90]: ${lat}`
        });
      }

      if (lng < -180 || lng > 180) {
        issues.push({
          type: 'error',
          message: `Longitude ngoài phạm vi [-180, 180]: ${lng}`
        });
      }

      // Kiểm tra tọa độ (0, 0) - thường là lỗi
      if (lat === 0 && lng === 0) {
        issues.push({
          type: 'error',
          message: 'Tọa độ (0, 0) - có thể là lỗi nhập liệu'
        });
      }

      // Kiểm tra khoảng cách từ Trà Vinh
      const distance = calculateDistance(lat, lng, TVU_CENTER.lat, TVU_CENTER.lng);
      if (distance > MAX_REASONABLE_DISTANCE) {
        issues.push({
          type: 'warning',
          message: `Cách Trà Vinh ${distance.toFixed(1)}km - có thể sai tọa độ`
        });
      }

      // Kiểm tra độ chính xác (quá nhiều chữ số thập phân)
      const latDecimals = (lat.toString().split('.')[1] || '').length;
      const lngDecimals = (lng.toString().split('.')[1] || '').length;
      if (latDecimals > 6 || lngDecimals > 6) {
        issues.push({
          type: 'warning',
          message: `Quá nhiều chữ số thập phân (lat: ${latDecimals}, lng: ${lngDecimals})`
        });
      }

      // Kiểm tra tọa độ có nằm trong khu vực Việt Nam không
      const VN_LAT_MIN = 8.5, VN_LAT_MAX = 23.5;
      const VN_LNG_MIN = 102.0, VN_LNG_MAX = 110.0;
      
      if (lat < VN_LAT_MIN || lat > VN_LAT_MAX || lng < VN_LNG_MIN || lng > VN_LNG_MAX) {
        issues.push({
          type: 'warning',
          message: 'Tọa độ nằm ngoài Việt Nam'
        });
      }

      return issues;
    }

    window.validateAllCoordinates = async function() {
      const reportDiv = document.getElementById('report');
      const loadingDiv = document.getElementById('loading');
      const statsDiv = document.getElementById('stats');
      const validateBtn = document.getElementById('validateBtn');
      const exportBtn = document.getElementById('exportBtn');

      try {
        validateBtn.disabled = true;
        loadingDiv.style.display = 'block';
        reportDiv.innerHTML = '';
        statsDiv.style.display = 'none';
        exportBtn.style.display = 'none';
        validationResults = [];

        const querySnapshot = await getDocs(collection(db, 'places'));
        
        let totalCount = 0;
        let validCount = 0;
        let warningCount = 0;
        let errorCount = 0;

        const results = {
          valid: [],
          warnings: [],
          errors: [],
          missing: []
        };

        querySnapshot.forEach((doc) => {
          const data = doc.data();
          const placeName = data.name || data.tên || 'Chưa có tên';
          const placeId = doc.id;
          const category = data.category || data.loại || 'other';
          const address = data.location?.address || 'Chưa có địa chỉ';

          totalCount++;

          const result = {
            id: placeId,
            name: placeName,
            category: category,
            address: address,
            location: data.location,
            issues: []
          };

          // Kiểm tra có trường location không
          if (!data.location) {
            result.issues.push({
              type: 'error',
              message: 'Thiếu trường location'
            });
            results.missing.push(result);
            errorCount++;
          } else {
            const lat = data.location.lat;
            const lng = data.location.lng;

            // Kiểm tra có lat/lng không
            if (lat === undefined || lng === undefined) {
              result.issues.push({
                type: 'error',
                message: 'Thiếu lat hoặc lng'
              });
              results.missing.push(result);
              errorCount++;
            } else {
              // Validate tọa độ
              const issues = validateCoordinate(lat, lng);
              result.issues = issues;
              result.lat = lat;
              result.lng = lng;
              result.distanceFromTVU = calculateDistance(lat, lng, TVU_CENTER.lat, TVU_CENTER.lng);

              if (issues.length === 0) {
                results.valid.push(result);
                validCount++;
              } else {
                const hasError = issues.some(i => i.type === 'error');
                if (hasError) {
                  results.errors.push(result);
                  errorCount++;
                } else {
                  results.warnings.push(result);
                  warningCount++;
                }
              }
            }
          }

          validationResults.push(result);
        });

        // Update stats
        document.getElementById('totalCount').textContent = totalCount;
        document.getElementById('validCount').textContent = validCount;
        document.getElementById('warningCount').textContent = warningCount;
        document.getElementById('errorCount').textContent = errorCount;
        statsDiv.style.display = 'grid';

        // Generate report
        let reportHTML = '';

        // Summary
        reportHTML += '<div class="summary">';
        reportHTML += '<h2>📊 Tổng quan</h2>';
        reportHTML += `<div class="summary-item"><span class="summary-label">Tổng số địa điểm:</span><span class="summary-value">${totalCount}</span></div>`;
        reportHTML += `<div class="summary-item"><span class="summary-label">Hợp lệ ✅:</span><span class="summary-value">${validCount} (${(validCount/totalCount*100).toFixed(1)}%)</span></div>`;
        reportHTML += `<div class="summary-item"><span class="summary-label">Cảnh báo ⚠️:</span><span class="summary-value">${warningCount} (${(warningCount/totalCount*100).toFixed(1)}%)</span></div>`;
        reportHTML += `<div class="summary-item"><span class="summary-label">Lỗi ❌:</span><span class="summary-value">${errorCount} (${(errorCount/totalCount*100).toFixed(1)}%)</span></div>`;
        reportHTML += '</div>';

        // Errors
        if (results.errors.length > 0 || results.missing.length > 0) {
          reportHTML += '<h2 style="color: #e74c3c; margin-top: 30px;">❌ Địa điểm có lỗi (' + (results.errors.length + results.missing.length) + ')</h2>';
          
          [...results.missing, ...results.errors].forEach(place => {
            reportHTML += '<div class="place-item error">';
            reportHTML += `<div class="place-name">📍 ${place.name}</div>`;
            reportHTML += `<div class="place-details">`;
            reportHTML += `ID: ${place.id}<br>`;
            reportHTML += `Danh mục: ${place.category}<br>`;
            reportHTML += `Địa chỉ: ${place.address}<br>`;
            if (place.lat !== undefined) {
              reportHTML += `Tọa độ: ${place.lat}, ${place.lng}<br>`;
              reportHTML += `Cách TVU: ${place.distanceFromTVU.toFixed(2)}km<br>`;
            }
            place.issues.forEach(issue => {
              reportHTML += `<span class="badge badge-error">${issue.message}</span>`;
            });
            reportHTML += `</div></div>`;
          });
        }

        // Warnings
        if (results.warnings.length > 0) {
          reportHTML += '<h2 style="color: #f39c12; margin-top: 30px;">⚠️ Địa điểm cần xem xét (' + results.warnings.length + ')</h2>';
          
          results.warnings.forEach(place => {
            reportHTML += '<div class="place-item warning">';
            reportHTML += `<div class="place-name">📍 ${place.name}</div>`;
            reportHTML += `<div class="place-details">`;
            reportHTML += `ID: ${place.id}<br>`;
            reportHTML += `Danh mục: ${place.category}<br>`;
            reportHTML += `Địa chỉ: ${place.address}<br>`;
            reportHTML += `Tọa độ: ${place.lat}, ${place.lng}<br>`;
            reportHTML += `Cách TVU: ${place.distanceFromTVU.toFixed(2)}km<br>`;
            place.issues.forEach(issue => {
              reportHTML += `<span class="badge badge-warning">${issue.message}</span>`;
            });
            reportHTML += `</div></div>`;
          });
        }

        // Valid (chỉ hiển thị 10 đầu tiên)
        if (results.valid.length > 0) {
          reportHTML += '<h2 style="color: #27ae60; margin-top: 30px;">✅ Địa điểm hợp lệ (' + results.valid.length + ')</h2>';
          reportHTML += '<p style="color: #7f8c8d; margin-bottom: 15px;">Hiển thị 10 địa điểm đầu tiên...</p>';
          
          results.valid.slice(0, 10).forEach(place => {
            reportHTML += '<div class="place-item success">';
            reportHTML += `<div class="place-name">📍 ${place.name}</div>`;
            reportHTML += `<div class="place-details">`;
            reportHTML += `ID: ${place.id}<br>`;
            reportHTML += `Danh mục: ${place.category}<br>`;
            reportHTML += `Tọa độ: ${place.lat}, ${place.lng}<br>`;
            reportHTML += `Cách TVU: ${place.distanceFromTVU.toFixed(2)}km<br>`;
            reportHTML += `<span class="badge badge-success">Tọa độ hợp lệ</span>`;
            reportHTML += `</div></div>`;
          });
        }

        reportDiv.innerHTML = reportHTML;
        exportBtn.style.display = 'block';

      } catch (error) {
        reportDiv.innerHTML = `<div class="place-item error"><div class="place-name">❌ Lỗi</div><div class="place-details">${error.message}</div></div>`;
        console.error('Error:', error);
      } finally {
        loadingDiv.style.display = 'none';
        validateBtn.disabled = false;
      }
    };

    window.exportReport = function() {
      const dataStr = JSON.stringify(validationResults, null, 2);
      const dataBlob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `coordinate-validation-${new Date().toISOString().split('T')[0]}.json`;
      link.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
