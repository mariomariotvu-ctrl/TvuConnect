<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Document Uploader Info</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .result {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-family: monospace;
        }
        button {
            background: #4F46E5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #4338CA;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <h1>🔍 Test Document Uploader Info</h1>
    
    <div class="test-section">
        <h3>Bước 1: Nhập User ID</h3>
        <input type="text" id="userId" placeholder="Nhập User ID" style="width: 100%; padding: 8px; margin: 10px 0;">
        <button onclick="checkUserProfile()">Kiểm tra Profile</button>
    </div>

    <div class="test-section">
        <h3>Kết quả:</h3>
        <div id="result"></div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, getDoc, collection, query, limit, getDocs } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        // Firebase config - REPLACE WITH YOUR CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyDXSZ8v7OW7YqVHZxGxGxGxGxGxGxGxGxG",
            authDomain: "your-app.firebaseapp.com",
            projectId: "your-project-id",
            storageBucket: "your-app.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.checkUserProfile = async function() {
            const userId = document.getElementById('userId').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!userId) {
                resultDiv.innerHTML = '<p class="error">Vui lòng nhập User ID!</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Đang kiểm tra...</p>';

            try {
                // Check profiles collection (where user data is actually stored)
                const userDoc = await getDoc(doc(db, 'profiles', userId));
                
                if (!userDoc.exists()) {
                    resultDiv.innerHTML = '<p class="error">❌ Profile không tồn tại!</p>';
                    return;
                }

                const userData = userDoc.data();
                
                let html = '<div class="success"><h4>✅ Tìm thấy profile!</h4></div>';
                html += '<div class="result">';
                html += '<h4>Dữ liệu thô từ Firestore (profiles collection):</h4>';
                html += '<pre>' + JSON.stringify(userData, null, 2) + '</pre>';
                html += '</div>';

                html += '<div class="result">';
                html += '<h4>Phân tích các trường tên:</h4>';
                html += '<p><strong>fullName:</strong> ' + (userData.fullName || '❌ Không có') + '</p>';
                html += '<p><strong>displayName:</strong> ' + (userData.displayName || '❌ Không có') + '</p>';
                html += '<p><strong>name:</strong> ' + (userData.name || '❌ Không có') + '</p>';
                html += '<p><strong>firstName:</strong> ' + (userData.firstName || '❌ Không có') + '</p>';
                html += '<p><strong>lastName:</strong> ' + (userData.lastName || '❌ Không có') + '</p>';
                html += '<p><strong>email:</strong> ' + (userData.email || '❌ Không có') + '</p>';
                html += '</div>';

                // Determine what name would be shown (matching useUploaderProfile logic)
                let determinedName = userData.fullName
                    || userData.displayName 
                    || userData.name 
                    || (userData.firstName && userData.lastName 
                        ? `${userData.firstName} ${userData.lastName}`.trim()
                        : userData.firstName || userData.lastName);
                
                if (!determinedName && userData.email) {
                    determinedName = userData.email.split('@')[0];
                }
                
                if (!determinedName) {
                    determinedName = `User ${userId.substring(0, 8)}`;
                }

                html += '<div class="result">';
                html += '<h4>Tên sẽ hiển thị:</h4>';
                html += '<p style="font-size: 18px; font-weight: bold; color: #4F46E5;">' + determinedName + '</p>';
                html += '</div>';

                resultDiv.innerHTML = html;

            } catch (error) {
                resultDiv.innerHTML = '<p class="error">❌ Lỗi: ' + error.message + '</p>';
                console.error('Error:', error);
            }
        };

        // Auto-load first document uploader
        window.addEventListener('load', async () => {
            try {
                const docsQuery = query(collection(db, 'documents'), limit(1));
                const docsSnapshot = await getDocs(docsQuery);
                
                if (!docsSnapshot.empty) {
                    const firstDoc = docsSnapshot.docs[0].data();
                    if (firstDoc.createdBy) {
                        document.getElementById('userId').value = firstDoc.createdBy;
                        document.getElementById('result').innerHTML = 
                            '<p class="success">✅ Đã tự động load User ID từ document đầu tiên. Click "Kiểm tra Profile" để xem.</p>';
                    }
                }
            } catch (error) {
                console.error('Auto-load error:', error);
            }
        });
    </script>
</body>
</html>
