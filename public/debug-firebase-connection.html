<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Firebase Connection - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
    }

    .section {
      margin-bottom: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 10px;
      border-left: 4px solid #667eea;
    }

    .section h2 {
      color: #333;
      margin-bottom: 15px;
      font-size: 18px;
    }

    button {
      padding: 12px 20px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      font-weight: 600;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }

    .status.info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }

    .status.warning {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeaa7;
    }

    .code-block {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 15px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      overflow-x: auto;
      margin-top: 10px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-top: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      border: 2px solid #e0e0e0;
    }

    .card h3 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .card .value {
      font-size: 24px;
      font-weight: bold;
      color: #333;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f3f3f3;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-left: 5px;
    }

    .badge-success {
      background: #28a745;
      color: white;
    }

    .badge-error {
      background: #dc3545;
      color: white;
    }

    .badge-warning {
      background: #ffc107;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Debug Firebase Connection</h1>
    <p style="color: #666; margin-bottom: 20px;">Kiểm tra kết nối và dữ liệu Firebase</p>

    <!-- Test 1: Firebase Config -->
    <div class="section">
      <h2>1️⃣ Firebase Configuration</h2>
      <button onclick="testConfig()">🔧 Kiểm tra Config</button>
      <div id="configStatus"></div>
    </div>

    <!-- Test 2: API Connection -->
    <div class="section">
      <h2>2️⃣ API Connection Test</h2>
      <button onclick="testAPIConnection()">🌐 Test API</button>
      <div id="apiStatus"></div>
    </div>

    <!-- Test 3: Collections Count -->
    <div class="section">
      <h2>3️⃣ Collections Data Count</h2>
      <button onclick="testAllCollections()">📊 Đếm tất cả Collections</button>
      <div id="collectionsStatus"></div>
      <div id="collectionsGrid" class="grid"></div>
    </div>

    <!-- Test 4: Places Collection Detail -->
    <div class="section">
      <h2>4️⃣ Places Collection (Chi tiết)</h2>
      <button onclick="testPlacesDetail()">📍 Kiểm tra Places</button>
      <div id="placesStatus"></div>
    </div>

    <!-- Test 5: Firestore Rules -->
    <div class="section">
      <h2>5️⃣ Firestore Rules Test</h2>
      <button onclick="testRules()">🔒 Test Rules</button>
      <div id="rulesStatus"></div>
    </div>
  </div>

  <script>
    const API_KEY = 'AIzaSyBB1ulUF5F7iScd1vm4xOfQamFlT5pbP9M';
    const PROJECT_ID = 'gen-lang-client-0050597412';
    const BASE_URL = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents`;

    // Test 1: Config
    function testConfig() {
      const status = document.getElementById('configStatus');
      status.innerHTML = `
        <div class="status info">
          <strong>✅ Firebase Config:</strong><br>
          Project ID: <code>${PROJECT_ID}</code><br>
          API Key: <code>${API_KEY.substring(0, 20)}...</code><br>
          Base URL: <code>${BASE_URL}</code>
        </div>
      `;
    }

    // Test 2: API Connection
    async function testAPIConnection() {
      const status = document.getElementById('apiStatus');
      status.innerHTML = '<div class="status info">⏳ Đang test kết nối API...</div>';

      try {
        const url = `${BASE_URL}?key=${API_KEY}`;
        const startTime = Date.now();
        const response = await fetch(url);
        const endTime = Date.now();
        const responseTime = endTime - startTime;

        if (response.ok) {
          const data = await response.json();
          status.innerHTML = `
            <div class="status success">
              ✅ <strong>Kết nối thành công!</strong><br>
              Response time: ${responseTime}ms<br>
              Status: ${response.status} ${response.statusText}
            </div>
            <div class="code-block">${JSON.stringify(data, null, 2).substring(0, 500)}...</div>
          `;
        } else {
          const errorText = await response.text();
          status.innerHTML = `
            <div class="status error">
              ❌ <strong>Lỗi kết nối!</strong><br>
              Status: ${response.status} ${response.statusText}
            </div>
            <div class="code-block">${errorText}</div>
          `;
        }
      } catch (error) {
        status.innerHTML = `
          <div class="status error">
            ❌ <strong>Lỗi:</strong> ${error.message}
          </div>
        `;
      }
    }

    // Test 3: All Collections
    async function testAllCollections() {
      const status = document.getElementById('collectionsStatus');
      const grid = document.getElementById('collectionsGrid');
      
      status.innerHTML = '<div class="status info">⏳ Đang đếm dữ liệu...</div>';
      grid.innerHTML = '';

      const collections = ['users', 'places', 'posts', 'checkIns', 'events', 'messages', 'matches'];
      const results = {};

      for (const collection of collections) {
        try {
          const url = `${BASE_URL}/${collection}?key=${API_KEY}&pageSize=1000`;
          const response = await fetch(url);
          
          if (response.ok) {
            const data = await response.json();
            results[collection] = {
              count: data.documents ? data.documents.length : 0,
              status: 'success'
            };
          } else {
            results[collection] = {
              count: 0,
              status: 'error',
              error: `${response.status} ${response.statusText}`
            };
          }
        } catch (error) {
          results[collection] = {
            count: 0,
            status: 'error',
            error: error.message
          };
        }
      }

      // Display results
      let totalDocs = 0;
      let html = '';
      
      for (const [collection, result] of Object.entries(results)) {
        totalDocs += result.count;
        const icon = getCollectionIcon(collection);
        const badge = result.status === 'success' 
          ? `<span class="badge badge-success">✓</span>` 
          : `<span class="badge badge-error">✗</span>`;
        
        html += `
          <div class="card">
            <h3>${icon} ${collection}</h3>
            <div class="value">${result.count} ${badge}</div>
            ${result.error ? `<small style="color: #dc3545;">${result.error}</small>` : ''}
          </div>
        `;
      }

      grid.innerHTML = html;
      status.innerHTML = `
        <div class="status ${totalDocs > 0 ? 'success' : 'warning'}">
          ${totalDocs > 0 ? '✅' : '⚠️'} <strong>Tổng cộng: ${totalDocs} documents</strong>
        </div>
      `;
    }

    // Test 4: Places Detail
    async function testPlacesDetail() {
      const status = document.getElementById('placesStatus');
      status.innerHTML = '<div class="status info">⏳ Đang kiểm tra Places...</div>';

      try {
        const url = `${BASE_URL}/places?key=${API_KEY}&pageSize=10`;
        const response = await fetch(url);

        if (!response.ok) {
          const errorText = await response.text();
          status.innerHTML = `
            <div class="status error">
              ❌ <strong>Lỗi ${response.status}:</strong> ${response.statusText}<br>
              <small>Có thể do Firestore Rules chặn hoặc collection không tồn tại</small>
            </div>
            <div class="code-block">${errorText}</div>
          `;
          return;
        }

        const data = await response.json();
        
        if (!data.documents || data.documents.length === 0) {
          status.innerHTML = `
            <div class="status warning">
              ⚠️ <strong>Collection "places" trống!</strong><br>
              Không có dữ liệu địa điểm trong database.<br>
              <small>Bạn cần thêm dữ liệu vào collection này.</small>
            </div>
          `;
          return;
        }

        // Parse first place
        const firstPlace = data.documents[0];
        const fields = parseFirestoreFields(firstPlace.fields || {});

        status.innerHTML = `
          <div class="status success">
            ✅ <strong>Tìm thấy ${data.documents.length} places!</strong>
          </div>
          <div style="margin-top: 15px;">
            <strong>Ví dụ place đầu tiên:</strong>
            <div class="code-block">${JSON.stringify(fields, null, 2)}</div>
          </div>
        `;

      } catch (error) {
        status.innerHTML = `
          <div class="status error">
            ❌ <strong>Lỗi:</strong> ${error.message}
          </div>
        `;
      }
    }

    // Test 5: Rules
    async function testRules() {
      const status = document.getElementById('rulesStatus');
      status.innerHTML = '<div class="status info">⏳ Đang test Firestore Rules...</div>';

      const tests = [
        { collection: 'places', method: 'GET', description: 'Read places' },
        { collection: 'users', method: 'GET', description: 'Read users' },
        { collection: 'posts', method: 'GET', description: 'Read posts' }
      ];

      let html = '<div style="margin-top: 15px;">';
      
      for (const test of tests) {
        try {
          const url = `${BASE_URL}/${test.collection}?key=${API_KEY}&pageSize=1`;
          const response = await fetch(url);
          
          if (response.ok) {
            html += `<div class="status success" style="margin-bottom: 10px;">
              ✅ <strong>${test.description}:</strong> Allowed (${response.status})
            </div>`;
          } else {
            html += `<div class="status error" style="margin-bottom: 10px;">
              ❌ <strong>${test.description}:</strong> Denied (${response.status} ${response.statusText})
            </div>`;
          }
        } catch (error) {
          html += `<div class="status error" style="margin-bottom: 10px;">
            ❌ <strong>${test.description}:</strong> Error (${error.message})
          </div>`;
        }
      }

      html += '</div>';
      status.innerHTML = html;
    }

    // Helper functions
    function parseFirestoreFields(fields) {
      const result = {};
      for (const [key, value] of Object.entries(fields)) {
        if (value.stringValue !== undefined) {
          result[key] = value.stringValue;
        } else if (value.integerValue !== undefined) {
          result[key] = parseInt(value.integerValue);
        } else if (value.doubleValue !== undefined) {
          result[key] = value.doubleValue;
        } else if (value.booleanValue !== undefined) {
          result[key] = value.booleanValue;
        } else if (value.timestampValue !== undefined) {
          result[key] = value.timestampValue;
        } else if (value.mapValue) {
          result[key] = parseFirestoreFields(value.mapValue.fields || {});
        } else if (value.arrayValue) {
          result[key] = (value.arrayValue.values || []).map(v => {
            if (v.stringValue) return v.stringValue;
            if (v.integerValue) return parseInt(v.integerValue);
            return v;
          });
        } else {
          result[key] = JSON.stringify(value);
        }
      }
      return result;
    }

    function getCollectionIcon(collection) {
      const icons = {
        users: '👤',
        places: '📍',
        posts: '📝',
        checkIns: '✅',
        events: '🎉',
        messages: '💬',
        matches: '💑'
      };
      return icons[collection] || '📄';
    }

    // Auto run config test
    window.onload = () => {
      testConfig();
    };
  </script>
</body>
</html>
