<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Subscription System - TVU Connect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-3xl font-bold mb-8 text-gray-900">🧪 Test Subscription System</h1>
    
    <!-- Status Bar -->
    <div id="statusBar" class="bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded mb-6 hidden">
      <p id="statusText">Đang tải Firebase...</p>
    </div>
    
    <!-- Test 1: Initialize User -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Test 1: Khởi tạo User với Trial</h2>
      <div class="space-y-3">
        <input 
          type="text" 
          id="userId1" 
          placeholder="Nhập User ID (ví dụ: test_user_001)" 
          class="w-full px-4 py-2 border rounded-lg"
        />
        <button 
          id="btn1"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-gray-400"
        >
          Khởi tạo User
        </button>
        <div id="result1" class="mt-4 p-4 bg-gray-100 rounded-lg hidden"></div>
      </div>
    </div>

    <!-- Test 2: Check Premium Status -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Test 2: Kiểm tra Premium Status</h2>
      <div class="space-y-3">
        <input 
          type="text" 
          id="userId2" 
          placeholder="Nhập User ID" 
          class="w-full px-4 py-2 border rounded-lg"
        />
        <button 
          id="btn2"
          class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:bg-gray-400"
        >
          Kiểm tra Status
        </button>
        <div id="result2" class="mt-4 p-4 bg-gray-100 rounded-lg hidden"></div>
      </div>
    </div>

    <!-- Test 3: Activate Premium -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Test 3: Kích hoạt Premium</h2>
      <div class="space-y-3">
        <input 
          type="text" 
          id="userId3" 
          placeholder="Nhập User ID" 
          class="w-full px-4 py-2 border rounded-lg"
        />
        <input 
          type="number" 
          id="duration" 
          placeholder="Số ngày (mặc định 7)" 
          value="7"
          class="w-full px-4 py-2 border rounded-lg"
        />
        <button 
          id="btn3"
          class="px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 disabled:bg-gray-400"
        >
          Kích hoạt Premium
        </button>
        <div id="result3" class="mt-4 p-4 bg-gray-100 rounded-lg hidden"></div>
      </div>
    </div>

    <!-- Test 4: Generate QR Code -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-xl font-bold mb-4">Test 4: Tạo mã QR thanh toán</h2>
      <div class="space-y-3">
        <input 
          type="text" 
          id="userId4" 
          placeholder="Nhập User ID" 
          class="w-full px-4 py-2 border rounded-lg"
        />
        <button 
          id="btn4"
          class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:bg-gray-400"
        >
          Tạo QR Code
        </button>
        <div id="result4" class="mt-4 hidden">
          <img id="qrImage" class="w-64 h-64 mx-auto rounded-lg shadow-lg" />
          <p id="qrInfo" class="text-center mt-4 text-sm text-gray-600"></p>
        </div>
      </div>
    </div>

    <!-- Test 5: List All Users -->
    <div class="bg-white rounded-lg shadow p-6">
      <h2 class="text-xl font-bold mb-4">Test 5: Danh sách Users</h2>
      <button 
        id="btn5"
        class="px-6 py-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700 disabled:bg-gray-400"
      >
        Tải danh sách
      </button>
      <div id="result5" class="mt-4 hidden">
        <table class="w-full border-collapse">
          <thead>
            <tr class="bg-gray-100">
              <th class="border p-2 text-left">User ID</th>
              <th class="border p-2 text-left">Trial còn</th>
              <th class="border p-2 text-left">Premium</th>
              <th class="border p-2 text-left">Premium còn</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      updateDoc, 
      collection,
      getDocs,
      serverTimestamp,
      Timestamp 
    } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

    // Show status
    function showStatus(message, type = 'info') {
      const statusBar = document.getElementById('statusBar');
      const statusText = document.getElementById('statusText');
      statusBar.classList.remove('hidden', 'bg-blue-100', 'bg-green-100', 'bg-red-100');
      statusBar.classList.add(
        type === 'success' ? 'bg-green-100' : 
        type === 'error' ? 'bg-red-100' : 'bg-blue-100'
      );
      statusText.textContent = message;
      console.log('[STATUS]', message);
    }

    showStatus('Đang khởi tạo Firebase...');

    // Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyByuf-sL2MfEE2zE4reYHxqAGlDg5CcJ9w",
      authDomain: "gen-lang-client-0050597412.firebaseapp.com",
      projectId: "gen-lang-client-0050597412",
      storageBucket: "gen-lang-client-0050597412.firebasestorage.app",
      messagingSenderId: "43871673395",
      appId: "1:43871673395:web:00e950c3694f2a49291746"
    };

    let app, db;
    
    try {
      app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      showStatus('✅ Firebase đã sẵn sàng! Bạn có thể bắt đầu test.', 'success');
      console.log('[SUCCESS] Firebase initialized');
    } catch (error) {
      showStatus('❌ Lỗi khởi tạo Firebase: ' + error.message, 'error');
      console.error('[ERROR] Firebase init failed:', error);
    }

    // Test 1: Initialize User
    document.getElementById('btn1').addEventListener('click', async () => {
      console.log('[TEST 1] Button clicked');
      const userId = document.getElementById('userId1').value.trim();
      const resultDiv = document.getElementById('result1');
      const btn = document.getElementById('btn1');
      
      if (!userId) {
        alert('Vui lòng nhập User ID');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang xử lý...';
      showStatus('Đang tạo user...');

      try {
        console.log('[TEST 1] Creating user:', userId);
        const now = new Date();
        const trialExpiry = new Date(now.getTime() + 7 * 24 * 60 * 60 * 1000);

        await setDoc(doc(db, 'users', userId), {
          createdAt: serverTimestamp(),
          trialExpiryDate: Timestamp.fromDate(trialExpiry),
          isPremium: false,
          premiumExpiryDate: null,
          updatedAt: serverTimestamp(),
        });

        console.log('[TEST 1] User created successfully');
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `
          <p class="text-green-600 font-bold">✅ Thành công!</p>
          <p class="text-sm mt-2">User ID: ${userId}</p>
          <p class="text-sm">Trial hết hạn: ${trialExpiry.toLocaleString('vi-VN')}</p>
        `;
        showStatus('✅ User đã được tạo thành công!', 'success');
      } catch (error) {
        console.error('[TEST 1] Error:', error);
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `<p class="text-red-600">❌ Lỗi: ${error.message}</p>`;
        showStatus('❌ Lỗi: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Khởi tạo User';
      }
    });

    // Test 2: Check Premium Status
    document.getElementById('btn2').addEventListener('click', async () => {
      console.log('[TEST 2] Button clicked');
      const userId = document.getElementById('userId2').value.trim();
      const resultDiv = document.getElementById('result2');
      const btn = document.getElementById('btn2');
      
      if (!userId) {
        alert('Vui lòng nhập User ID');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang kiểm tra...';
      showStatus('Đang kiểm tra status...');

      try {
        console.log('[TEST 2] Checking user:', userId);
        const userDoc = await getDoc(doc(db, 'users', userId));
        
        if (!userDoc.exists()) {
          console.log('[TEST 2] User not found');
          resultDiv.classList.remove('hidden');
          resultDiv.innerHTML = '<p class="text-red-600">❌ User không tồn tại</p>';
          showStatus('❌ User không tồn tại', 'error');
          return;
        }

        const data = userDoc.data();
        const now = new Date();
        
        const trialExpiry = data.trialExpiryDate?.toDate();
        const premiumExpiry = data.premiumExpiryDate?.toDate();
        
        const trialDaysLeft = trialExpiry 
          ? Math.max(0, Math.ceil((trialExpiry - now) / (1000 * 60 * 60 * 24)))
          : 0;
        
        const premiumDaysLeft = premiumExpiry 
          ? Math.max(0, Math.ceil((premiumExpiry - now) / (1000 * 60 * 60 * 24)))
          : 0;

        const isTrialActive = trialExpiry && now < trialExpiry;
        const isPremium = data.isPremium && premiumExpiry && now < premiumExpiry;
        const hasAccess = isTrialActive || isPremium;

        console.log('[TEST 2] Status:', { hasAccess, isTrialActive, isPremium });

        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `
          <div class="space-y-2">
            <p class="font-bold ${hasAccess ? 'text-green-600' : 'text-red-600'}">
              ${hasAccess ? '✅ Có quyền truy cập' : '❌ Không có quyền truy cập'}
            </p>
            <p class="text-sm">Trial: ${isTrialActive ? `Còn ${trialDaysLeft} ngày` : 'Đã hết hạn'}</p>
            <p class="text-sm">Premium: ${isPremium ? `Còn ${premiumDaysLeft} ngày` : 'Chưa kích hoạt'}</p>
            <p class="text-xs text-gray-500 mt-4">Created: ${data.createdAt?.toDate().toLocaleString('vi-VN')}</p>
          </div>
        `;
        showStatus('✅ Kiểm tra hoàn tất', 'success');
      } catch (error) {
        console.error('[TEST 2] Error:', error);
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `<p class="text-red-600">❌ Lỗi: ${error.message}</p>`;
        showStatus('❌ Lỗi: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kiểm tra Status';
      }
    });

    // Test 3: Activate Premium
    document.getElementById('btn3').addEventListener('click', async () => {
      console.log('[TEST 3] Button clicked');
      const userId = document.getElementById('userId3').value.trim();
      const duration = parseInt(document.getElementById('duration').value) || 7;
      const resultDiv = document.getElementById('result3');
      const btn = document.getElementById('btn3');
      
      if (!userId) {
        alert('Vui lòng nhập User ID');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Đang kích hoạt...';
      showStatus('Đang kích hoạt Premium...');

      try {
        console.log('[TEST 3] Activating premium for:', userId);
        const now = new Date();
        const expiryDate = new Date(now.getTime() + duration * 24 * 60 * 60 * 1000);

        await updateDoc(doc(db, 'users', userId), {
          isPremium: true,
          premiumExpiryDate: Timestamp.fromDate(expiryDate),
          updatedAt: serverTimestamp(),
        });

        console.log('[TEST 3] Premium activated');
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `
          <p class="text-green-600 font-bold">✅ Premium đã được kích hoạt!</p>
          <p class="text-sm mt-2">Hết hạn: ${expiryDate.toLocaleString('vi-VN')}</p>
          <p class="text-sm">Thời hạn: ${duration} ngày</p>
        `;
        showStatus('✅ Premium đã được kích hoạt!', 'success');
      } catch (error) {
        console.error('[TEST 3] Error:', error);
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `<p class="text-red-600">❌ Lỗi: ${error.message}</p>`;
        showStatus('❌ Lỗi: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Kích hoạt Premium';
      }
    });

    // Test 4: Generate QR
    document.getElementById('btn4').addEventListener('click', () => {
      console.log('[TEST 4] Button clicked');
      const userId = document.getElementById('userId4').value.trim();
      const resultDiv = document.getElementById('result4');
      
      if (!userId) {
        alert('Vui lòng nhập User ID');
        return;
      }

      const bankId = 'MB';
      const accountNo = '0123456789';
      const accountName = 'NGUYEN VAN A';
      const amount = 3000;
      const transferContent = `TVU_CONNECT_ID_${userId}`;
      
      const qrUrl = `https://img.vietqr.io/image/${bankId}-${accountNo}-compact2.png?amount=${amount}&addInfo=${encodeURIComponent(transferContent)}&accountName=${encodeURIComponent(accountName)}`;
      
      console.log('[TEST 4] QR URL:', qrUrl);
      document.getElementById('qrImage').src = qrUrl;
      document.getElementById('qrInfo').innerHTML = `
        Số tiền: <strong>3.000 VNĐ</strong><br>
        Nội dung: <strong>${transferContent}</strong>
      `;
      
      resultDiv.classList.remove('hidden');
      showStatus('✅ QR Code đã được tạo!', 'success');
    });

    // Test 5: List Users
    document.getElementById('btn5').addEventListener('click', async () => {
      console.log('[TEST 5] Button clicked');
      const resultDiv = document.getElementById('result5');
      const tableBody = document.getElementById('usersTable');
      const btn = document.getElementById('btn5');
      
      btn.disabled = true;
      btn.textContent = 'Đang tải...';
      showStatus('Đang tải danh sách users...');

      try {
        console.log('[TEST 5] Fetching users');
        const usersSnapshot = await getDocs(collection(db, 'users'));
        const now = new Date();
        
        tableBody.innerHTML = '';
        
        console.log('[TEST 5] Found', usersSnapshot.size, 'users');
        
        usersSnapshot.forEach((doc) => {
          const data = doc.data();
          const trialExpiry = data.trialExpiryDate?.toDate();
          const premiumExpiry = data.premiumExpiryDate?.toDate();
          
          const trialDaysLeft = trialExpiry 
            ? Math.max(0, Math.ceil((trialExpiry - now) / (1000 * 60 * 60 * 24)))
            : 0;
          
          const premiumDaysLeft = premiumExpiry 
            ? Math.max(0, Math.ceil((premiumExpiry - now) / (1000 * 60 * 60 * 24)))
            : 0;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td class="border p-2 text-sm">${doc.id.length > 15 ? doc.id.slice(0, 15) + '...' : doc.id}</td>
            <td class="border p-2 text-sm">${trialDaysLeft} ngày</td>
            <td class="border p-2 text-sm">${data.isPremium ? '✅' : '❌'}</td>
            <td class="border p-2 text-sm">${premiumDaysLeft} ngày</td>
          `;
          tableBody.appendChild(row);
        });
        
        resultDiv.classList.remove('hidden');
        showStatus(`✅ Đã tải ${usersSnapshot.size} users`, 'success');
      } catch (error) {
        console.error('[TEST 5] Error:', error);
        alert('Lỗi: ' + error.message);
        showStatus('❌ Lỗi: ' + error.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Tải danh sách';
      }
    });

    console.log('[INIT] All event listeners attached');
  </script>
</body>
</html>
