<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test AI Mobile Debug - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 8px;
      font-size: 24px;
    }
    
    .subtitle {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    
    .section {
      margin-bottom: 24px;
      padding: 16px;
      background: #f8f9fa;
      border-radius: 12px;
      border-left: 4px solid #667eea;
    }
    
    .section-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      font-size: 16px;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #e0e0e0;
    }
    
    .info-row:last-child {
      border-bottom: none;
    }
    
    .label {
      font-weight: 500;
      color: #666;
      font-size: 14px;
    }
    
    .value {
      font-weight: 600;
      color: #333;
      font-size: 14px;
    }
    
    .status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
    
    .status.warning {
      background: #fff3cd;
      color: #856404;
    }
    
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
      margin-bottom: 12px;
    }
    
    button:hover {
      transform: translateY(-2px);
    }
    
    button:active {
      transform: translateY(0);
    }
    
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .log {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 16px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      max-height: 300px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .log-entry {
      margin-bottom: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #333;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .log-time {
      color: #858585;
      font-size: 11px;
    }
    
    .log-success {
      color: #4ec9b0;
    }
    
    .log-error {
      color: #f48771;
    }
    
    .log-info {
      color: #569cd6;
    }
    
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 Test AI Mobile Debug</h1>
    <p class="subtitle">Kiểm tra API key và kết nối Gemini AI</p>
    
    <!-- API Key Info -->
    <div class="section">
      <div class="section-title">📋 Thông tin API Key</div>
      <div class="info-row">
        <span class="label">API Key:</span>
        <span class="value" id="apiKeyDisplay">Đang tải...</span>
      </div>
      <div class="info-row">
        <span class="label">Trạng thái:</span>
        <span class="status" id="apiKeyStatus">Chưa kiểm tra</span>
      </div>
    </div>
    
    <!-- Test Buttons -->
    <button id="testApiKeyBtn">
      <span id="testApiKeyText">🔑 Test API Key</span>
    </button>
    
    <button id="testSimpleMessageBtn">
      <span id="testSimpleMessageText">💬 Test Tin nhắn đơn giản</span>
    </button>
    
    <button id="testVenueSearchBtn">
      <span id="testVenueSearchText">📍 Test Tìm địa điểm</span>
    </button>
    
    <!-- Logs -->
    <div class="section">
      <div class="section-title">📝 Logs</div>
      <div class="log" id="logContainer">
        <div class="log-entry">
          <span class="log-time">[Sẵn sàng]</span>
          <span class="log-info">Nhấn nút để bắt đầu test...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Get API key from environment
    const API_KEY = 'AIzaSyBB1ulUF5F7iScd1vm4xOfQamFlT5pbP9M';
    
    // Display API key (masked)
    const apiKeyDisplay = document.getElementById('apiKeyDisplay');
    if (API_KEY) {
      apiKeyDisplay.textContent = API_KEY.substring(0, 10) + '...' + API_KEY.substring(API_KEY.length - 4);
    } else {
      apiKeyDisplay.textContent = 'Không tìm thấy';
      document.getElementById('apiKeyStatus').textContent = 'Thiếu API Key';
      document.getElementById('apiKeyStatus').className = 'status error';
    }
    
    // Log function
    function log(message, type = 'info') {
      const logContainer = document.getElementById('logContainer');
      const time = new Date().toLocaleTimeString('vi-VN');
      const logEntry = document.createElement('div');
      logEntry.className = 'log-entry';
      logEntry.innerHTML = `
        <span class="log-time">[${time}]</span>
        <span class="log-${type}">${message}</span>
      `;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }
    
    // Test API Key
    document.getElementById('testApiKeyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('testApiKeyBtn');
      const btnText = document.getElementById('testApiKeyText');
      
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>Đang kiểm tra...';
      
      log('🔍 Bắt đầu kiểm tra API key...', 'info');
      
      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              contents: [
                {
                  role: 'user',
                  parts: [{ text: 'Hello' }]
                }
              ]
            })
          }
        );
        
        log(`📡 Response status: ${response.status}`, 'info');
        
        if (response.ok) {
          const data = await response.json();
          log('✅ API key hợp lệ!', 'success');
          log(`📦 Response: ${JSON.stringify(data).substring(0, 100)}...`, 'info');
          document.getElementById('apiKeyStatus').textContent = 'Hợp lệ';
          document.getElementById('apiKeyStatus').className = 'status success';
        } else {
          const errorData = await response.json().catch(() => ({ error: 'Unknown' }));
          log(`❌ Lỗi ${response.status}: ${JSON.stringify(errorData)}`, 'error');
          document.getElementById('apiKeyStatus').textContent = `Lỗi ${response.status}`;
          document.getElementById('apiKeyStatus').className = 'status error';
        }
      } catch (error) {
        log(`❌ Lỗi: ${error.message}`, 'error');
        document.getElementById('apiKeyStatus').textContent = 'Lỗi kết nối';
        document.getElementById('apiKeyStatus').className = 'status error';
      } finally {
        btn.disabled = false;
        btnText.textContent = '🔑 Test API Key';
      }
    });
    
    // Test Simple Message
    document.getElementById('testSimpleMessageBtn').addEventListener('click', async () => {
      const btn = document.getElementById('testSimpleMessageBtn');
      const btnText = document.getElementById('testSimpleMessageText');
      
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>Đang gửi...';
      
      log('💬 Gửi tin nhắn test: "Xin chào"', 'info');
      
      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              contents: [
                {
                  role: 'user',
                  parts: [{ text: 'Xin chào, bạn là ai?' }]
                }
              ],
              generationConfig: {
                temperature: 0.7,
                topK: 40,
                topP: 0.95,
                maxOutputTokens: 1024,
              }
            })
          }
        );
        
        log(`📡 Response status: ${response.status}`, 'info');
        
        if (response.ok) {
          const data = await response.json();
          const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Không có phản hồi';
          log('✅ Nhận được phản hồi từ AI!', 'success');
          log(`🤖 AI: ${aiResponse.substring(0, 200)}...`, 'info');
        } else {
          const errorData = await response.json().catch(() => ({ error: 'Unknown' }));
          log(`❌ Lỗi ${response.status}: ${JSON.stringify(errorData)}`, 'error');
        }
      } catch (error) {
        log(`❌ Lỗi: ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = '💬 Test Tin nhắn đơn giản';
      }
    });
    
    // Test Venue Search
    document.getElementById('testVenueSearchBtn').addEventListener('click', async () => {
      const btn = document.getElementById('testVenueSearchBtn');
      const btnText = document.getElementById('testVenueSearchText');
      
      btn.disabled = true;
      btnText.innerHTML = '<span class="spinner"></span>Đang tìm...';
      
      log('📍 Gửi yêu cầu tìm quán cafe', 'info');
      
      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              contents: [
                {
                  role: 'user',
                  parts: [{ text: 'Tìm quán cafe yên tĩnh' }]
                }
              ],
              tools: [
                {
                  functionDeclarations: [
                    {
                      name: 'searchVenues',
                      description: 'Tìm kiếm địa điểm',
                      parameters: {
                        type: 'object',
                        properties: {
                          category: {
                            type: 'string',
                            enum: ['cafe', 'restaurant', 'all']
                          },
                          keywords: {
                            type: 'string'
                          }
                        }
                      }
                    }
                  ]
                }
              ],
              generationConfig: {
                temperature: 0.3,
                topK: 20,
                topP: 0.85,
                maxOutputTokens: 2048,
              }
            })
          }
        );
        
        log(`📡 Response status: ${response.status}`, 'info');
        
        if (response.ok) {
          const data = await response.json();
          log('✅ Nhận được phản hồi!', 'success');
          log(`📦 Response: ${JSON.stringify(data).substring(0, 300)}...`, 'info');
          
          const functionCall = data.candidates?.[0]?.content?.parts?.[0]?.functionCall;
          if (functionCall) {
            log(`🔧 AI muốn gọi function: ${functionCall.name}`, 'success');
            log(`📋 Args: ${JSON.stringify(functionCall.args)}`, 'info');
          }
        } else {
          const errorData = await response.json().catch(() => ({ error: 'Unknown' }));
          log(`❌ Lỗi ${response.status}: ${JSON.stringify(errorData)}`, 'error');
        }
      } catch (error) {
        log(`❌ Lỗi: ${error.message}`, 'error');
      } finally {
        btn.disabled = false;
        btnText.textContent = '📍 Test Tìm địa điểm';
      }
    });
    
    // Auto-run API key test on load
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('testApiKeyBtn').click();
      }, 500);
    });
  </script>
</body>
</html>
