<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TVU Connect — Tham gia ngay</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #eef2ff;
      }

      .poster {
        position: relative;
        width: min(100vw, 1254px);
        margin: 0 auto;
        line-height: 0;
      }

      .poster img {
        display: block;
        width: 100%;
        height: auto;
      }

      .poster-cta {
        position: absolute;
        left: 32.4%;
        top: 84.5%;
        width: 35.6%;
        height: 7.4%;
        border-radius: 999px;
      }

      .poster-cta:focus-visible {
        outline: 4px solid #ffffff;
        outline-offset: -6px;
      }
    </style>
  </head>
  <body>
    <main class="poster">
      <img
        src="./tvu-connect-social-square-qr-v2.png"
        alt="TVU Connect — Kết nối sinh viên Trà Vinh"
        width="1254"
        height="1254"
      />
      <a
        class="poster-cta"
        href="https://tvuconnect.vercel.app/"
        aria-label="Tham gia TVU Connect ngay"
      ></a>
    </main>
  </body>
</html>
