<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Environment Variables - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .status-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #667eea;
    }

    .status-card.success {
      border-left-color: #10b981;
      background: #f0fdf4;
    }

    .status-card.error {
      border-left-color: #ef4444;
      background: #fef2f2;
    }

    .status-card h3 {
      margin-bottom: 10px;
      font-size: 18px;
      color: #333;
    }

    .env-var {
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      word-break: break-all;
    }

    .env-var strong {
      color: #667eea;
      display: block;
      margin-bottom: 5px;
    }

    .env-var .value {
      color: #059669;
    }

    .env-var .missing {
      color: #ef4444;
      font-style: italic;
    }

    .test-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #e5e7eb;
    }

    .test-button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 10px;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .test-button:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .test-button:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-top: 15px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 3px solid #f3f4f6;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .device-info {
      background: #eff6ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .device-info strong {
      color: #1e40af;
    }

    @media (max-width: 640px) {
      .container {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }

      .test-button {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 Environment Variables Test</h1>
    <p class="subtitle">Kiểm tra environment variables đã load đúng chưa</p>

    <div class="device-info">
      <strong>Device:</strong> <span id="deviceType"></span><br>
      <strong>Screen:</strong> <span id="screenSize"></span><br>
      <strong>User Agent:</strong> <span id="userAgent"></span>
    </div>

    <div id="envStatus" class="status-card">
      <h3>📋 Environment Variables Status</h3>
      <div id="envVars"></div>
    </div>

    <div class="test-section">
      <h3 style="margin-bottom: 15px;">🧪 Test Firebase Connection</h3>
      <button class="test-button" onclick="testFirebase()" id="firebaseBtn">
        Test Firebase
      </button>
      <div id="firebaseResult"></div>
    </div>

    <div class="test-section">
      <h3 style="margin-bottom: 15px;">🤖 Test Gemini AI</h3>
      <button class="test-button" onclick="testGemini()" id="geminiBtn">
        Test Gemini AI
      </button>
      <div id="geminiResult"></div>
    </div>
  </div>

  <script type="module">
    // Detect device type
    const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    const isTablet = /iPad|Android/i.test(navigator.userAgent) && window.innerWidth >= 768;
    
    let deviceType = 'Desktop';
    if (isMobile && !isTablet) deviceType = 'Mobile';
    if (isTablet) deviceType = 'Tablet';

    document.getElementById('deviceType').textContent = deviceType;
    document.getElementById('screenSize').textContent = `${window.innerWidth} x ${window.innerHeight}`;
    document.getElementById('userAgent').textContent = navigator.userAgent.substring(0, 80) + '...';

    // Check environment variables
    const envVars = {
      'VITE_FIREBASE_API_KEY': import.meta.env.VITE_FIREBASE_API_KEY,
      'VITE_FIREBASE_AUTH_DOMAIN': import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
      'VITE_FIREBASE_PROJECT_ID': import.meta.env.VITE_FIREBASE_PROJECT_ID,
      'VITE_FIREBASE_STORAGE_BUCKET': import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
      'VITE_FIREBASE_MESSAGING_SENDER_ID': import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
      'VITE_FIREBASE_APP_ID': import.meta.env.VITE_FIREBASE_APP_ID,
      'VITE_FIREBASE_DATABASE_ID': import.meta.env.VITE_FIREBASE_DATABASE_ID,
      'VITE_GEMINI_API_KEY': import.meta.env.VITE_GEMINI_API_KEY,
    };

    let allPresent = true;
    let html = '';

    for (const [key, value] of Object.entries(envVars)) {
      const present = value && value !== 'undefined';
      if (!present) allPresent = false;

      // Mask sensitive values
      let displayValue = value;
      if (present && key.includes('KEY')) {
        displayValue = value.substring(0, 10) + '...' + value.substring(value.length - 4);
      }

      html += `
        <div class="env-var">
          <strong>${key}</strong>
          ${present 
            ? `<span class="value">✅ ${displayValue}</span>` 
            : `<span class="missing">❌ Missing</span>`
          }
        </div>
      `;
    }

    document.getElementById('envVars').innerHTML = html;

    const statusCard = document.getElementById('envStatus');
    if (allPresent) {
      statusCard.classList.add('success');
    } else {
      statusCard.classList.add('error');
    }

    // Test Firebase
    window.testFirebase = async () => {
      const btn = document.getElementById('firebaseBtn');
      const result = document.getElementById('firebaseResult');
      
      btn.disabled = true;
      btn.innerHTML = 'Testing... <span class="loading"></span>';
      result.innerHTML = '';

      try {
        const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
        const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');

        const firebaseConfig = {
          apiKey: import.meta.env.VITE_FIREBASE_API_KEY,
          authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN,
          projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID,
          storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET,
          messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID,
          appId: import.meta.env.VITE_FIREBASE_APP_ID,
        };

        const app = initializeApp(firebaseConfig, 'test-app-' + Date.now());
        const db = getFirestore(app);

        result.innerHTML = `<div class="result">✅ Firebase initialized successfully!

Project ID: ${firebaseConfig.projectId}
Auth Domain: ${firebaseConfig.authDomain}

Status: Connected ✓</div>`;
      } catch (error) {
        result.innerHTML = `<div class="result">❌ Firebase Error:

${error.message}

Stack:
${error.stack}</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Test Firebase';
      }
    };

    // Test Gemini AI
    window.testGemini = async () => {
      const btn = document.getElementById('geminiBtn');
      const result = document.getElementById('geminiResult');
      
      btn.disabled = true;
      btn.innerHTML = 'Testing... <span class="loading"></span>';
      result.innerHTML = '';

      try {
        const API_KEY = import.meta.env.VITE_GEMINI_API_KEY;
        
        if (!API_KEY) {
          throw new Error('VITE_GEMINI_API_KEY is missing');
        }

        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent?key=${API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                role: 'user',
                parts: [{ text: 'Say "Hello from TVU Connect!" in Vietnamese' }]
              }]
            })
          }
        );

        if (!response.ok) {
          throw new Error(`API Error: ${response.status} ${response.statusText}`);
        }

        const data = await response.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response';

        result.innerHTML = `<div class="result">✅ Gemini AI Response:

${text}

Status: API Key Valid ✓
Model: gemini-2.5-flash-lite</div>`;
      } catch (error) {
        result.innerHTML = `<div class="result">❌ Gemini AI Error:

${error.message}

Note: Check if API key is valid and has quota remaining.</div>`;
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Test Gemini AI';
      }
    };
  </script>
</body>
</html>
