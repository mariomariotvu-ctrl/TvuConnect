<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Test - TVU Connect</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-align: center;
        }
        .test-item {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
        }
        .test-item h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #fbbf24;
        }
        .test-item p {
            font-size: 14px;
            line-height: 1.6;
        }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }
        .pass { background: #10b981; }
        .fail { background: #ef4444; }
        .pending { background: #f59e0b; }
        button {
            width: 100%;
            padding: 15px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active { transform: scale(0.98); }
        .log {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-top: 20px;
        }
        .log-entry {
            padding: 4px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 React Loading Test</h1>
        
        <div class="test-item">
            <h3>1. Basic JavaScript</h3>
            <p id="js-test">Testing...</p>
        </div>

        <div class="test-item">
            <h3>2. Fetch API</h3>
            <p id="fetch-test">Testing...</p>
        </div>

        <div class="test-item">
            <h3>3. LocalStorage</h3>
            <p id="storage-test">Testing...</p>
        </div>

        <div class="test-item">
            <h3>4. Module Loading</h3>
            <p id="module-test">Testing...</p>
        </div>

        <div class="test-item">
            <h3>5. React Bundle</h3>
            <p id="react-test">Testing...</p>
        </div>

        <button onclick="runTests()">Run Tests Again</button>
        <button onclick="window.location.href='/'">Go to Main App</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const log = (msg, type = 'info') => {
            const logEl = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${msg}`;
            if (type === 'error') entry.style.color = '#f87171';
            if (type === 'success') entry.style.color = '#4ade80';
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        };

        const setStatus = (id, text, pass) => {
            const el = document.getElementById(id);
            const statusClass = pass ? 'pass' : (pass === false ? 'fail' : 'pending');
            el.innerHTML = `${text} <span class="status ${statusClass}">${pass ? 'PASS' : (pass === false ? 'FAIL' : 'PENDING')}</span>`;
        };

        function runTests() {
            document.getElementById('log').innerHTML = '';
            log('Starting tests...');

            // Test 1: Basic JavaScript
            try {
                const test = [1, 2, 3].map(x => x * 2);
                setStatus('js-test', 'JavaScript works', true);
                log('Test 1: JavaScript OK', 'success');
            } catch (e) {
                setStatus('js-test', 'JavaScript failed: ' + e.message, false);
                log('Test 1: JavaScript FAILED - ' + e.message, 'error');
            }

            // Test 2: Fetch API
            fetch('/test.html')
                .then(res => {
                    if (res.ok) {
                        setStatus('fetch-test', 'Fetch API works', true);
                        log('Test 2: Fetch API OK', 'success');
                    } else {
                        setStatus('fetch-test', 'Fetch failed: ' + res.status, false);
                        log('Test 2: Fetch FAILED - Status ' + res.status, 'error');
                    }
                })
                .catch(e => {
                    setStatus('fetch-test', 'Fetch error: ' + e.message, false);
                    log('Test 2: Fetch ERROR - ' + e.message, 'error');
                });

            // Test 3: LocalStorage
            try {
                localStorage.setItem('test', 'value');
                const val = localStorage.getItem('test');
                localStorage.removeItem('test');
                if (val === 'value') {
                    setStatus('storage-test', 'LocalStorage works', true);
                    log('Test 3: LocalStorage OK', 'success');
                } else {
                    setStatus('storage-test', 'LocalStorage read failed', false);
                    log('Test 3: LocalStorage FAILED', 'error');
                }
            } catch (e) {
                setStatus('storage-test', 'LocalStorage error: ' + e.message, false);
                log('Test 3: LocalStorage ERROR - ' + e.message, 'error');
            }

            // Test 4: Module Loading
            const testModule = document.createElement('script');
            testModule.type = 'module';
            testModule.textContent = `
                console.log('Module test');
                window.moduleTestPassed = true;
            `;
            document.head.appendChild(testModule);
            
            setTimeout(() => {
                if (window.moduleTestPassed) {
                    setStatus('module-test', 'ES Modules work', true);
                    log('Test 4: ES Modules OK', 'success');
                } else {
                    setStatus('module-test', 'ES Modules may not work', false);
                    log('Test 4: ES Modules FAILED', 'error');
                }
            }, 100);

            // Test 5: React Bundle
            log('Test 5: Attempting to load React bundle...');
            fetch('/src/main.tsx')
                .then(res => {
                    if (res.ok) {
                        setStatus('react-test', 'React bundle file exists', true);
                        log('Test 5: React bundle file found', 'success');
                        
                        // Try to actually load it
                        const script = document.createElement('script');
                        script.type = 'module';
                        script.src = '/src/main.tsx';
                        script.onload = () => {
                            log('Test 5: React bundle loaded successfully!', 'success');
                        };
                        script.onerror = (e) => {
                            log('Test 5: React bundle load ERROR - ' + e, 'error');
                        };
                        // Don't actually append to avoid conflicts
                    } else {
                        setStatus('react-test', 'React bundle not found', false);
                        log('Test 5: React bundle NOT FOUND', 'error');
                    }
                })
                .catch(e => {
                    setStatus('react-test', 'Cannot check React bundle: ' + e.message, false);
                    log('Test 5: React bundle check ERROR - ' + e.message, 'error');
                });

            log('All tests initiated!');
        }

        // Run tests on load
        runTests();

        // Device info
        log('Device: ' + navigator.userAgent.substring(0, 80));
        log('Screen: ' + window.innerWidth + 'x' + window.innerHeight);
        log('Memory: ' + (navigator.deviceMemory || 'unknown') + ' GB');
        log('Cores: ' + (navigator.hardwareConcurrency || 'unknown'));
    </script>
</body>
</html>
