<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debug Tour Mobile - TVU Connect</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .test-section h3 {
      margin-top: 0;
      color: #333;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background: #4F46E5;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background: #4338CA;
    }
    .result {
      margin-top: 10px;
      padding: 10px;
      background: #f5f5f5;
      border-radius: 5px;
      font-family: monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .warning { background: #fff3cd; color: #856404; }
    .info { background: #d1ecf1; color: #0c5460; }
  </style>
</head>
<body>
  <h1>🔍 Debug Tour Mobile - TVU Connect</h1>
  <p>Tool này giúp debug vấn đề tour không khởi động trên mobile</p>

  <div class="test-section">
    <h3>1. Kiểm tra Device Type</h3>
    <button onclick="checkDeviceType()">Check Device Type</button>
    <div id="device-result" class="result"></div>
  </div>

  <div class="test-section">
    <h3>2. Kiểm tra Tour Elements</h3>
    <button onclick="checkTourElements()">Check Tour Elements</button>
    <div id="elements-result" class="result"></div>
  </div>

  <div class="test-section">
    <h3>3. Simulate Tour Trigger (Mobile)</h3>
    <button onclick="simulateMobileTourTrigger()">Simulate Mobile Tour</button>
    <div id="mobile-result" class="result"></div>
  </div>

  <div class="test-section">
    <h3>4. Simulate Tour Trigger (Desktop)</h3>
    <button onclick="simulateDesktopTourTrigger()">Simulate Desktop Tour</button>
    <div id="desktop-result" class="result"></div>
  </div>

  <div class="test-section">
    <h3>5. Check Console Logs</h3>
    <p>Mở DevTools Console để xem logs chi tiết</p>
  </div>

  <script>
    function checkDeviceType() {
      const width = window.innerWidth;
      const isMobile = width < 768;
      const result = {
        windowWidth: width,
        isMobile: isMobile,
        userAgent: navigator.userAgent,
        deviceType: isMobile ? 'Mobile' : 'Desktop'
      };
      
      document.getElementById('device-result').innerHTML = JSON.stringify(result, null, 2);
      document.getElementById('device-result').className = 'result info';
      console.log('Device Type Check:', result);
    }

    function checkTourElements() {
      const elements = document.querySelectorAll('[data-tour]');
      const result = {
        totalElements: elements.length,
        expectedElements: 7,
        status: elements.length >= 7 ? 'PASS' : 'FAIL',
        elements: Array.from(elements).map(el => ({
          tag: el.tagName,
          dataTour: el.getAttribute('data-tour'),
          visible: el.offsetParent !== null
        }))
      };
      
      const resultDiv = document.getElementById('elements-result');
      resultDiv.innerHTML = JSON.stringify(result, null, 2);
      resultDiv.className = result.status === 'PASS' ? 'result success' : 'result error';
      console.log('Tour Elements Check:', result);
    }

    function simulateMobileTourTrigger() {
      console.log('=== SIMULATING MOBILE TOUR TRIGGER ===');
      const resultDiv = document.getElementById('mobile-result');
      resultDiv.innerHTML = 'Starting simulation...\n';
      resultDiv.className = 'result info';

      // Simulate mobile
      const isMobile = window.innerWidth < 768;
      const delay = isMobile ? 350 : 100;
      
      console.log('Device check:', { isMobile, delay, width: window.innerWidth });
      resultDiv.innerHTML += `Device: ${isMobile ? 'Mobile' : 'Desktop'}\n`;
      resultDiv.innerHTML += `Delay: ${delay}ms\n`;
      resultDiv.innerHTML += `Waiting ${delay}ms...\n`;

      setTimeout(() => {
        console.log('After initial delay, checking elements...');
        resultDiv.innerHTML += `\nChecking elements after ${delay}ms delay...\n`;

        const checkElements = () => {
          const elements = document.querySelectorAll('[data-tour]');
          console.log('Elements found:', elements.length);
          return elements.length >= 7;
        };

        let retries = 0;
        const maxRetries = 5;
        const retryLog = [];

        const tryStartTour = () => {
          const elementsReady = checkElements();
          const elements = document.querySelectorAll('[data-tour]');
          
          retryLog.push({
            retry: retries,
            elementsFound: elements.length,
            elementsReady: elementsReady
          });

          console.log(`Retry ${retries}:`, {
            elementsFound: elements.length,
            elementsReady: elementsReady
          });

          if (elementsReady) {
            console.log('✅ Tour would start now!');
            resultDiv.innerHTML += `\n✅ SUCCESS! Tour would start\n`;
            resultDiv.innerHTML += `Elements found: ${elements.length}/7\n`;
            resultDiv.innerHTML += `Retries needed: ${retries}\n`;
            resultDiv.innerHTML += `\nRetry log:\n${JSON.stringify(retryLog, null, 2)}`;
            resultDiv.className = 'result success';
          } else if (retries < maxRetries) {
            retries++;
            resultDiv.innerHTML += `Retry ${retries}/${maxRetries}: ${elements.length}/7 elements\n`;
            setTimeout(tryStartTour, 100);
          } else {
            console.error('❌ Tour elements not found after retries');
            resultDiv.innerHTML += `\n❌ FAILED! Elements not found after ${maxRetries} retries\n`;
            resultDiv.innerHTML += `Final elements found: ${elements.length}/7\n`;
            resultDiv.innerHTML += `\nRetry log:\n${JSON.stringify(retryLog, null, 2)}`;
            resultDiv.className = 'result error';
          }
        };

        tryStartTour();
      }, delay);
    }

    function simulateDesktopTourTrigger() {
      console.log('=== SIMULATING DESKTOP TOUR TRIGGER ===');
      const resultDiv = document.getElementById('desktop-result');
      resultDiv.innerHTML = 'Starting simulation...\n';
      resultDiv.className = 'result info';

      // Force desktop delay
      const delay = 100;
      
      console.log('Device check:', { isMobile: false, delay, width: window.innerWidth });
      resultDiv.innerHTML += `Device: Desktop (forced)\n`;
      resultDiv.innerHTML += `Delay: ${delay}ms\n`;
      resultDiv.innerHTML += `Waiting ${delay}ms...\n`;

      setTimeout(() => {
        console.log('After initial delay, checking elements...');
        resultDiv.innerHTML += `\nChecking elements after ${delay}ms delay...\n`;

        const checkElements = () => {
          const elements = document.querySelectorAll('[data-tour]');
          console.log('Elements found:', elements.length);
          return elements.length >= 7;
        };

        let retries = 0;
        const maxRetries = 5;
        const retryLog = [];

        const tryStartTour = () => {
          const elementsReady = checkElements();
          const elements = document.querySelectorAll('[data-tour]');
          
          retryLog.push({
            retry: retries,
            elementsFound: elements.length,
            elementsReady: elementsReady
          });

          console.log(`Retry ${retries}:`, {
            elementsFound: elements.length,
            elementsReady: elementsReady
          });

          if (elementsReady) {
            console.log('✅ Tour would start now!');
            resultDiv.innerHTML += `\n✅ SUCCESS! Tour would start\n`;
            resultDiv.innerHTML += `Elements found: ${elements.length}/7\n`;
            resultDiv.innerHTML += `Retries needed: ${retries}\n`;
            resultDiv.innerHTML += `\nRetry log:\n${JSON.stringify(retryLog, null, 2)}`;
            resultDiv.className = 'result success';
          } else if (retries < maxRetries) {
            retries++;
            resultDiv.innerHTML += `Retry ${retries}/${maxRetries}: ${elements.length}/7 elements\n`;
            setTimeout(tryStartTour, 100);
          } else {
            console.error('❌ Tour elements not found after retries');
            resultDiv.innerHTML += `\n❌ FAILED! Elements not found after ${maxRetries} retries\n`;
            resultDiv.innerHTML += `Final elements found: ${elements.length}/7\n`;
            resultDiv.innerHTML += `\nRetry log:\n${JSON.stringify(retryLog, null, 2)}`;
            resultDiv.className = 'result error';
          }
        };

        tryStartTour();
      }, delay);
    }

    // Auto-run device check on load
    window.addEventListener('load', () => {
      checkDeviceType();
    });
  </script>
</body>
</html>
