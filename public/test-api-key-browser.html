<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Gemini API Key - TVU Connect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 600px;
      width: 100%;
      padding: 40px;
    }

    h1 {
      color: #667eea;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s;
      font-family: monospace;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .result {
      margin-top: 30px;
      padding: 20px;
      border-radius: 10px;
      display: none;
    }

    .result.success {
      background: #d4edda;
      border: 2px solid #28a745;
      color: #155724;
    }

    .result.error {
      background: #f8d7da;
      border: 2px solid #dc3545;
      color: #721c24;
    }

    .result.warning {
      background: #fff3cd;
      border: 2px solid #ffc107;
      color: #856404;
    }

    .result-title {
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .result-message {
      line-height: 1.6;
      margin-bottom: 10px;
    }

    .result-steps {
      margin-top: 15px;
      padding-left: 20px;
    }

    .result-steps li {
      margin-bottom: 8px;
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .info-box {
      background: #e7f3ff;
      border-left: 4px solid #2196F3;
      padding: 15px;
      margin-bottom: 20px;
      border-radius: 5px;
      font-size: 14px;
      line-height: 1.6;
    }

    code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔑 Test Gemini API Key</h1>
    <p class="subtitle">TVU Connect - AI Assistant Testing Tool</p>

    <div class="info-box">
      <strong>📝 Hướng dẫn:</strong><br>
      1. Tạo API key tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a><br>
      2. Paste API key vào ô bên dưới<br>
      3. Chọn model muốn test<br>
      4. Click "Test API Key"
    </div>

    <div class="input-group">
      <label for="apiKey">API Key:</label>
      <input 
        type="text" 
        id="apiKey" 
        placeholder="AIzaSy..."
        autocomplete="off"
      >
    </div>

    <div class="input-group">
      <label for="model">Model:</label>
      <select id="model">
        <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (Khuyến nghị - nhẹ nhất)</option>
        <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        <option value="gemini-2.5-pro">gemini-2.5-pro</option>
        <option value="gemini-2.0-flash">gemini-2.0-flash</option>
      </select>
    </div>

    <button id="testBtn" onclick="testAPIKey()">
      Test API Key
    </button>

    <div id="result" class="result"></div>
  </div>

  <script>
    async function testAPIKey() {
      const apiKey = document.getElementById('apiKey').value.trim();
      const model = document.getElementById('model').value;
      const resultDiv = document.getElementById('result');
      const testBtn = document.getElementById('testBtn');

      // Validate
      if (!apiKey) {
        showResult('error', 'Lỗi', 'Vui lòng nhập API key!');
        return;
      }

      if (!apiKey.startsWith('AIzaSy')) {
        showResult('warning', 'Cảnh báo', 'API key thường bắt đầu bằng "AIzaSy". Kiểm tra lại xem có copy đúng không?');
        return;
      }

      // Show loading
      testBtn.disabled = true;
      testBtn.innerHTML = '<span class="loading"></span> Đang test...';
      resultDiv.style.display = 'none';

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ 
                role: 'user', 
                parts: [{ text: 'Xin chào! Bạn có thể giới thiệu về TVU Connect không?' }] 
              }],
              generationConfig: { 
                maxOutputTokens: 100,
                temperature: 0.7
              }
            })
          }
        );

        if (response.ok) {
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Không có phản hồi';
          
          showResult('success', '✅ Thành công!', 
            `<strong>API key hoạt động tốt!</strong><br><br>
            <strong>Model:</strong> ${model}<br>
            <strong>AI trả lời:</strong><br>
            <div style="background: white; padding: 10px; border-radius: 5px; margin-top: 10px; border: 1px solid #28a745;">
              ${reply}
            </div>
            <br>
            <strong>🎯 Bước tiếp theo:</strong>
            <ol class="result-steps">
              <li>Copy API key này</li>
              <li>Mở file <code>.env.local</code></li>
              <li>Thay dòng <code>VITE_GEMINI_API_KEY=...</code></li>
              <li>Chạy <code>npm run dev</code></li>
              <li>Test AI trên http://localhost:5173</li>
            </ol>`
          );
        } else {
          const error = await response.json();
          const message = error.error?.message || 'Unknown error';
          
          if (response.status === 429) {
            showResult('error', '❌ Hết quota!', 
              `API key này đã hết quota.<br><br>
              <strong>Chi tiết:</strong> ${message}<br><br>
              <strong>💡 Giải pháp:</strong>
              <ul class="result-steps">
                <li>Tạo API key từ <strong>Google account KHÁC</strong></li>
                <li>Hoặc đợi 24 giờ để quota reset</li>
                <li>Hoặc nâng cấp lên paid tier</li>
              </ul>`
            );
          } else if (response.status === 400) {
            showResult('error', '❌ API key không hợp lệ!', 
              `<strong>Chi tiết:</strong> ${message}<br><br>
              <strong>💡 Kiểm tra:</strong>
              <ul class="result-steps">
                <li>Key có đúng format <code>AIzaSy...</code> không?</li>
                <li>Có copy đầy đủ không bị thiếu ký tự?</li>
                <li>Key có bị disable trên Google Cloud Console không?</li>
              </ul>`
            );
          } else if (response.status === 404) {
            showResult('error', '❌ Model không tồn tại!', 
              `Model <code>${model}</code> không khả dụng.<br><br>
              <strong>💡 Thử:</strong>
              <ul class="result-steps">
                <li>Chọn model khác từ dropdown</li>
                <li>Hoặc dùng <code>gemini-2.5-flash-lite</code></li>
              </ul>`
            );
          } else {
            showResult('error', `❌ Lỗi ${response.status}`, 
              `<strong>Chi tiết:</strong> ${message}<br><br>
              Vui lòng thử lại hoặc liên hệ hỗ trợ.`
            );
          }
        }
      } catch (error) {
        showResult('error', '❌ Lỗi kết nối!', 
          `<strong>Chi tiết:</strong> ${error.message}<br><br>
          <strong>💡 Kiểm tra:</strong>
          <ul class="result-steps">
            <li>Kết nối internet</li>
            <li>Firewall/Proxy</li>
            <li>CORS settings</li>
          </ul>`
        );
      } finally {
        testBtn.disabled = false;
        testBtn.innerHTML = 'Test API Key';
      }
    }

    function showResult(type, title, message) {
      const resultDiv = document.getElementById('result');
      resultDiv.className = `result ${type}`;
      resultDiv.innerHTML = `
        <div class="result-title">${title}</div>
        <div class="result-message">${message}</div>
      `;
      resultDiv.style.display = 'block';
      resultDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // Allow Enter key to submit
    document.getElementById('apiKey').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') testAPIKey();
    });
  </script>
</body>
</html>
